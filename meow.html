
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zarna BooBoo ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #fff5f5, #fce5eb, #fff8f5);
    overflow: hidden;
}

/* Soft background hearts */

.heart {
    position: absolute;
    color: #d994a8;
    opacity: .35;
    pointer-events: none;
    animation: float 7s ease-in-out infinite;
}

.h1 { top: 15%; left: 12%; font-size: 30px; }
.h2 { top: 25%; right: 12%; font-size: 22px; animation-delay: 2s; }
.h3 { bottom: 17%; left: 17%; font-size: 24px; animation-delay: 1s; }
.h4 { bottom: 20%; right: 15%; font-size: 34px; animation-delay: 3s; }

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* Main card */

.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 55px 28px;
    text-align: center;
    background: rgba(255,255,255,.8);
    border: 1px solid white;
    border-radius: 28px;
    box-shadow: 0 20px 65px rgba(160,90,110,.10);
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.top {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #b77a8c;
    margin-bottom: 30px;
}

.heart-icon {
    font-size: 43px;
    margin-bottom: 22px;
    animation: beat 2s infinite;
}

@keyframes beat {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(37px, 10vw, 49px);
    font-weight: 500;
    line-height: 1.25;
    color: #674550;
}

h1 span {
    display: block;
    color: #cf8198;
    font-style: italic;
}

.message {
    color: #987e87;
    font-size: 13px;
    line-height: 1.9;
    max-width: 300px;
    margin: 22px auto 30px;
}

.divider {
    color: #d28ba0;
    margin-bottom: 27px;
    font-size: 16px;
}

/* Button */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 265px;
    padding: 17px 25px;
    border-radius: 50px;
    background: linear-gradient(110deg,#dc94a8,#bd718a);
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(190,110,140,.25);
    transition: .3s ease;
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(190,110,140,.35);
}

.btn:active {
    transform: scale(.97);
}

.footer {
    margin-top: 30px;
    color: #b49aa2;
    font-size: 10px;
    letter-spacing: 2px;
}

.footer span {
    color: #d47e97;
}

/* Mobile */

@media(max-width:480px) {
    .card {
        padding: 45px 23px;
        border-radius: 25px;
    }

    .message {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- Background hearts -->
<div class="heart h1">♡</div>
<div class="heart h2">♥</div>
<div class="heart h3">♡</div>
<div class="heart h4">♥</div>

<!-- Main webpage -->

<div class="card">

    <div class="top">
        A little something for you
    </div>

    <div class="heart-icon">💗</div>

    <h1>
        Hey,
        <span>Baby❤️ </span>
    </h1>

    <p class="message">
        Today is your special day, and I just want
        to remind you how precious you are.
        I've made something special for you.
        Ready to see it? ❤️
    </p>

    <div class="divider">♡ &nbsp; ✦ &nbsp; ♡</div>

    <a class="btn"
       href="https://meowpages.site/g/86IhipgR">
       Open Your Surprise <span>♡</span>
    </a>

    <div class="footer">
        MADE WITH <span>♥</span> BY JALJIRA KUWAR
    </div>

</div>

</body>
</html>
