
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#251522">

<title>For Zarna BooBoo ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --background: #251522;
    --burgundy: #713b55;
    --rose: #b66d83;
    --gold: #d6ad78;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;
    background:
        radial-gradient(circle at 15% 20%, #62364f 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #513044 0%, transparent 35%),
        linear-gradient(135deg, #1d1220, #392032, #251522);
    overflow: hidden;
}

/* Floating Background Hearts */

.heart {
    position: fixed;
    color: var(--gold);
    opacity: .45;
    pointer-events: none;
    animation: float 7s ease-in-out infinite;
    z-index: 0;
}

.h1 { top: 15%; left: 12%; font-size: 30px; }
.h2 { top: 25%; right: 12%; font-size: 22px; animation-delay: 2s; }
.h3 { bottom: 17%; left: 17%; font-size: 24px; animation-delay: 1s; }
.h4 { bottom: 20%; right: 15%; font-size: 34px; animation-delay: 3s; }

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(0);
    }
    50% {
        transform: translateY(-18px) rotate(8deg);
    }
}

/* Main Card */

.card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 55px 28px;
    text-align: center;
    background: linear-gradient(145deg, #fffaf4, #f8e9df);
    border: 1px solid rgba(214,173,120,.6);
    border-radius: 28px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        0 0 35px rgba(214,173,120,.08);
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.top {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 4px;
    color: #a77a70;
    margin-bottom: 30px;
}

.heart-icon {
    font-size: 43px;
    margin-bottom: 22px;
    animation: beat 2s infinite;
    filter: drop-shadow(0 5px 8px rgba(182,109,131,.2));
}

@keyframes beat {
    0%,100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}

/* Heading */

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(37px, 10vw, 49px);
    font-weight: 500;
    line-height: 1.25;
    color: #482a3b;
}

h1 span {
    display: block;
    color: #ad687e;
    font-style: italic;
}

/* Message */

.message {
    color: #907580;
    font-size: 13px;
    line-height: 1.9;
    max-width: 300px;
    margin: 22px auto 30px;
}

.divider {
    color: #bd9569;
    margin-bottom: 27px;
    font-size: 16px;
}

/* Surprise Buttons */

.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    max-width: 265px;
    margin: 0 auto;
    padding: 17px 25px;
    border-radius: 50px;
    background: linear-gradient(110deg, #a95773, #713b55);
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .3px;
    box-shadow: 0 10px 25px rgba(113,59,85,.25);
    transition: .35s ease;
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(113,59,85,.35);
}

.btn:active {
    transform: scale(.97);
}

/* Second Surprise Button */

.btn-second {
    margin-top: 14px;
    background: linear-gradient(110deg, #d4a16e, #a96f68);
    box-shadow: 0 10px 25px rgba(169,111,104,.25);
}

.btn-second:hover {
    background: linear-gradient(110deg, #c48b61, #925665);
    box-shadow: 0 15px 30px rgba(169,111,104,.35);
}

/* Footer */

.footer {
    margin-top: 30px;
    color: #a58a83;
    font-size: 10px;
    letter-spacing: 2px;
}

.footer span {
    color: #b66d83;
}

/* Mobile Responsive */

@media(max-width:480px) {
    .card {
        padding: 45px 23px;
        border-radius: 25px;
    }

    .message {
        font-size: 12px;
    }

    .h1 { left: 5%; }
    .h2 { right: 5%; }
}

/* Reduced Motion */

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<!-- Background Hearts -->

<div class="heart h1">♡</div>
<div class="heart h2">♥</div>
<div class="heart h3">♡</div>
<div class="heart h4">♥</div>

<!-- Main Romantic Card -->

<div class="card">

    <div class="top">
        A little something for you
    </div>

    <div class="heart-icon">💗</div>

    <h1>
        Hey,
        <span>Baby ❤️</span>
    </h1>

    <p class="message">
        Today is your special day, and I just want
        to remind you how precious you are.
        I've made something special for you.
        Ready to see it? ❤️
    </p>

    <div class="divider">♡ &nbsp; ✦ &nbsp; ♡</div>

    <!-- First Surprise: SAME TAB -->

    <a class="btn"
       href="https://meowpages.site/g/86IhipgR">
       Open Your Surprise <span>♡</span>
    </a>

    <!-- Second Surprise: SAME TAB -->

    <a class="btn btn-second"
       href="https://zarnal.github.io/ZARNAL/31102026bdy">
       One More Surprise <span>💗</span>
    </a>

    <div class="footer">
        MADE WITH <span>♥</span> BY JALJIRA KUWAR
    </div>

</div>

<!-- JavaScript: Floating Hearts -->

<script>

const hearts = ['♡', '♥', '💕', '💗', '✦'];

function createHeart() {

    const heart = document.createElement('div');

    heart.textContent =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.position = 'fixed';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.bottom = '-30px';

    heart.style.fontSize =
        (14 + Math.random() * 18) + 'px';

    heart.style.color =
        Math.random() > 0.5 ? '#d6ad78' : '#c47e91';

    heart.style.opacity = '0.65';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '0';

    heart.style.transition =
        'transform 7s linear, opacity 7s linear';

    document.body.appendChild(heart);

    requestAnimationFrame(() => {

        heart.style.transform =
            `translateY(-110vh) rotate(${Math.random() * 180}deg)`;

        heart.style.opacity = '0';

    });

    setTimeout(() => {
        heart.remove();
    }, 7200);

}

// Generate hearts periodically

setInterval(createHeart, 900);

</script>

</body>
</html>
