<script>
'use strict';
(()=>{const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
let names=[],gender='All',letter='All',favOnly=false,query='',sort='az',filtered=[],shown=0,pageSize=80,selected=null;const favKey='bbnames_favorites_5k';let favs=[];try{const x=JSON.parse(localStorage.getItem(favKey)||'[]');if(Array.isArray(x))favs=x;}catch{}
const id=n=>n.Name+'|'+n.Gender;const isFav=n=>favs.includes(id(n));function persist(){try{localStorage.setItem(favKey,JSON.stringify(favs));}catch{}}function toggleFav(n){const k=id(n),i=favs.indexOf(k);if(i<0)favs.push(k);else favs.splice(i,1);persist();render();}
function apply(){let a=names.filter(n=>(gender==='All'||n.Gender===gender)&&(!favOnly||isFav(n))&&(letter==='All'||n.StartingLetter===letter));if(query){const terms=norm(query).split(' ').filter(Boolean);a=a.filter(n=>{const text=norm([n.Name,n.Meaning,n.Gender,n.Origin].join(' '));return terms.every(t=>text.includes(t));});}if(sort==='za')a.sort((x,y)=>y.Name.localeCompare(x.Name));else a.sort((x,y)=>x.Name.localeCompare(y.Name));return a;}
function card(n){const el=document.createElement('article');el.className='card';el.innerHTML='<div class="cardtop"><div class="namearea"><div class="name">'+esc(n.Name)+'</div><div class="meaning">'+esc(n.Meaning||'Meaning not listed')+'</div><span class="tag '+esc(String(n.Gender).toLowerCase())+'">'+esc(n.Gender)+'</span></div><button class="heart '+(isFav(n)?'on':'')+'" data-action="fav" aria-label="Favorite">'+(isFav(n)?'♥':'♡')+'</button></div><div class="details"><div><b>Origin:</b> '+esc(n.Origin||'Not listed')+'</div></div><button class="expand" data-action="expand">Details ↓</button>';el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){el.classList.toggle('expanded');return;}if(b.dataset.action==='fav')toggleFav(n);else{el.classList.toggle('expanded');b.textContent=el.classList.contains('expanded')?'Hide details ↑':'Details ↓';}});return el;}
function render(){filtered=apply();shown=0;$('list').replaceChildren();$('count').innerHTML='<strong>'+filtered.length.toLocaleString()+'</strong> names';$('favfilter').classList.toggle('active',favOnly);if(!filtered.length){$('list').innerHTML='<div class="empty">'+(favOnly?'No favorites saved yet. Tap ♡ on a name to save it.':'No matches. Try another search or filter.')+'</div>';$('loading').classList.remove('show');$('more').replaceChildren();return;}appendPage();}
function appendPage(){const end=Math.min(shown+pageSize,filtered.length),frag=document.createDocumentFragment();for(let i=shown;i<end;i++)frag.appendChild(card(filtered[i]));$('list').appendChild(frag);shown=end;$('more').innerHTML=shown<filtered.length?'<button>Show more ('+(filtered.length-shown).toLocaleString()+')</button>':'';$('more').firstElementChild?.addEventListener('click',appendPage);}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){gender=b.dataset.g;favOnly=false;document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('active',x===b));$('favfilter').classList.remove('active');render();return;}if(e.target.closest('#favfilter')){favOnly=!favOnly;gender='All';letter='All';document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('active',x.dataset.g==='All'));document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l==='All'));render();return;}if(e.target.closest('#random'))openRandom();});
$('alphabet').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;letter=b.dataset.l;favOnly=false;$('favfilter').classList.remove('active');document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x===b));render();});
$('search').addEventListener('input',e=>{query=e.target.value;$('clear').style.display=query?'block':'none';render();});$('clear').addEventListener('click',()=>{$('search').value='';query='';$('clear').style.display='none';render();$('search').focus();});
$('sort').addEventListener('change',e=>{sort=e.target.value;render();});$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');$('theme').textContent=d?'☀':'◐';try{localStorage.setItem('bbnames_theme_5k',d?'dark':'light');}catch{}});try{if(localStorage.getItem('bbnames_theme_5k')==='dark'){document.body.classList.add('dark');$('theme').textContent='☀';}}catch{}
function openRandom(){const a=apply();if(!a.length){selected=null;$('picked').textContent='No matching names';$('pickedmeaning').textContent='Adjust filters or search first.';}else{selected=a[Math.floor(Math.random()*a.length)];showPick();}$('modal').classList.add('show');}function showPick(){if(!selected)return;$('picked').textContent=selected.Name;$('pickedmeaning').textContent=selected.Meaning||'Meaning not listed';$('pickfav').textContent=isFav(selected)?'♥ Saved':'♡ Save';}
$('random').addEventListener('click',openRandom);$('again').addEventListener('click',openRandom);$('close').addEventListener('click',()=>$('modal').classList.remove('show'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('show');});$('pickfav').addEventListener('click',()=>{if(selected){toggleFav(selected);showPick();}});$('pickcopy').addEventListener('click',async()=>{if(selected){try{await navigator.clipboard.writeText(selected.Name);}catch{const t=document.createElement('textarea');t.value=selected.Name;document.body.append(t);t.select();try{document.execCommand('copy');}catch{}t.remove();}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show');});
try{names=JSON.parse($('babyNamesData').textContent);if(!Array.isArray(names)||names.length!==5000)throw new Error('Name list must contain 5000 records');names=names.filter(n=>n&&n.Name).map(n=>({...n,Name:String(n.Name).trim(),StartingLetter:String(n.Name).trim()[0].toUpperCase()}));render();}catch(err){console.error(err);$('list').innerHTML='<div class="empty">The name list failed to initialize. Reload the page.</div>';}
})();
