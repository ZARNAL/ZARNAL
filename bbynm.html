(()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();let names=[],searchIndex=[],religion='All',letter='All',gender='All',query='',sort='az',filtered=[],shown=0;const pageSize=60,favKey='bbnames_religion_favorites';let fav=[];try{fav=JSON.parse(localStorage.getItem(favKey)||'[]');if(!Array.isArray(fav))fav=[]}catch{fav=[]}const key=n=>n.Name+'|'+n.Gender,isFav=n=>fav.includes(key(n));
function filter(){const terms=query?norm(query).split(' ').filter(Boolean):[],out=[];for(let i=0;i<names.length;i++){const n=names[i];if(religion!=='All'&&religion!=='Favorites'&&n.Religion!==religion)continue;if(religion==='Favorites'&&!isFav(n))continue;if(letter!=='All'&&n.StartingLetter!==letter)continue;if(gender!=='All'&&n.Gender!==gender)continue;if(terms.length&&!terms.every(t=>searchIndex[i].includes(t)))continue;out.push(n)}out.sort((a,b)=>sort==='za'?b.Name.localeCompare(a.Name):a.Name.localeCompare(b.Name));return out}
function card(n){const el=document.createElement('article');el.className='card';el.innerHTML='<div class="toprow"><div class="namearea"><div class="name">'+esc(n.Name)+'</div><div class="meaning">'+esc(n.Meaning||'Meaning not listed')+'</div><span class="tag '+esc(n.Religion)+'">'+esc(n.Religion)+'</span></div><button class="heart '+(isFav(n)?'on':'')+'" aria-label="Favorite">'+(isFav(n)?'♥':'♡')+'</button></div><div class="details"><div><b>Origin:</b> '+esc(n.Origin||'Not listed')+'</div><div><b>Gender:</b> '+esc(n.Gender||'Not listed')+'</div><div><b>Religion:</b> '+esc(n.Religion)+' · traditional association</div></div><button class="expand">Details ↓</button>';el.querySelector('.heart').onclick=e=>{e.stopPropagation();const k=key(n),i=fav.indexOf(k);if(i<0)fav.push(k);else fav.splice(i,1);try{localStorage.setItem(favKey,JSON.stringify(fav))}catch{}draw()};el.querySelector('.expand').onclick=()=>{el.classList.toggle('expanded');el.querySelector('.expand').textContent=el.classList.contains('expanded')?'Hide details ↑':'Details ↓'};return el}
function draw(){filtered=filter();shown=0;$('list').replaceChildren();$('count').innerHTML='<strong>'+filtered.length.toLocaleString()+'</strong> names';if(!filtered.length){$('list').innerHTML='<div class="empty">'+(religion==='Favorites'?'No saved names yet — tap ♡ to save.':'No results. Try a different search or filter.')+'</div>';loadMore();return}append();loadMore()}
function append(){const end=Math.min(shown+pageSize,filtered.length),frag=document.createDocumentFragment();for(let i=shown;i<end;i++)frag.appendChild(card(filtered[i]));$('list').appendChild(frag);shown=end;$('shown').textContent='Showing '+shown.toLocaleString();loadMore()}
function loadMore(){$('more').innerHTML=shown<filtered.length?'<button>Load more · '+(filtered.length-shown).toLocaleString()+' left</button>':'';$('more').firstElementChild?.addEventListener('click',append)}
$('religions').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;religion=b.dataset.r;document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('active',x===b));draw()};$('letters').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;letter=b.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x===b));draw()};$('gender').onchange=e=>{gender=e.target.value;draw()};$('sort').onchange=e=>{sort=e.target.value;draw()};let debounce; $('search').oninput=e=>{query=e.target.value;$('clear').style.display=query?'block':'none';clearTimeout(debounce);debounce=setTimeout(draw,60)};$('clear').onclick=()=>{$('search').value='';query='';$('clear').style.display='none';draw();$('search').focus()};$('theme').onclick=()=>{document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');$('theme').textContent=d?'☀':'◐';try{localStorage.setItem('bbnames_theme',d?'dark':'light')}catch{}};try{if(localStorage.getItem('bbnames_theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='☀'}}catch{}
function start(){try{names=JSON.parse($('babyNamesData').textContent);if(!Array.isArray(names)||names.length!==5000)throw Error('dataset count mismatch');names=names.map(n=>({...n,Name:String(n.Name||'').trim(),StartingLetter:String(n.Name||'').trim()[0].toUpperCase(),Religion:n.Religion||'Unclassified'}));searchIndex=names.map(n=>norm([n.Name,n.Meaning,n.Origin,n.Gender,n.Religion].join(' ')));draw();$('app').classList.add('ready');$('boot').classList.add('done');setTimeout(()=>$('boot').remove(),250);$('foot').textContent='5,000 names · Search ready · Self-contained HTML'}catch(e){console.error('Names initialization error',e);$('ring').style.display='none';$('bootError').style.display='block';$('bootError').textContent='Name database could not initialize. Please refresh.'}}
setTimeout(start,70);setTimeout(()=>{if(!$('app').classList.contains('ready')){$('ring').style.display='none';$('bootError').style.display='block';$('bootError').textContent='Loading took too long. Refresh to try again.'}},10000);
