<script>
'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let names=[],gender='All',favoritesOnly=false,sort='alpha',query='',renderId=0,debounce=null,randomRecord=null;
const favKey='zarnal_baby_names_favorites_v2';
let favorites=[];
try{favorites=JSON.parse(localStorage.getItem(favKey)||'[]');if(!Array.isArray(favorites))favorites=[];}catch{favorites=[];}
const favMatch=(a,b)=>a&&b&&a.Name===b.Name&&a.Gender===b.Gender;
const isFav=n=>favorites.some(f=>favMatch(f,n));
function saveFavorites(){try{localStorage.setItem(favKey,JSON.stringify(favorites));return true;}catch{return false;}}
function normPopularity(n){const p=String(n.popularity||n['Popularity Trend']||'').toLowerCase();return ({popular:4,rising:3,stable:2,rare:1}[p]||0);}
function filtered(){
 let arr=names.filter(n=>(gender==='All'||n.Gender===gender)&&(!favoritesOnly||isFav(n)));
 if(query){const q=query.toLocaleLowerCase();arr=arr.filter(n=>[n.Name,n.Meaning,n.Origin,n['Cultural Significance'],n['Astrological Association'],n.Gender,n['Popularity Trend']].join(' ').toLocaleLowerCase().includes(q));}
 if(sort==='pop')arr.sort((a,b)=>normPopularity(b)-normPopularity(a)||a.Name.localeCompare(b.Name));
 else arr.sort((a,b)=>a.Name.localeCompare(b.Name));
 return arr;
}
function makeCard(n){
 const card=document.createElement('article');card.className='namecard '+String(n.Gender||'Unisex').toLowerCase();card.dataset.name=n.Name;card.dataset.gender=n.Gender;card.dataset.key=names.indexOf(n);
 const saved=isFav(n);
 card.innerHTML='<div class="cardtop"><div class="nameblock"><div class="nm">'+escapeHTML(n.Name)+'</div><div class="meaning">'+escapeHTML(n.Meaning||'Meaning not provided')+'</div><span class="genderpill">'+escapeHTML(n.Gender||'Unisex')+'</span></div><div class="actions"><button class="action fav '+(saved?'on':'')+'" data-action="fav" aria-label="'+(saved?'Remove favorite':'Save favorite')+'">'+(saved?'♥':'♡')+'</button><button class="action" data-action="copy" aria-label="Copy name">⧉</button></div></div><div class="details"><div class="detail"><label>Origin</label><span>'+escapeHTML(n.Origin||'Not specified')+'</span></div><div class="detail"><label>Cultural significance</label><span>'+escapeHTML(n['Cultural Significance']||'Not specified')+'</span></div><div class="detail"><label>Astrology</label><span>'+escapeHTML(n['Astrological Association']||'Not specified')+'</span></div><div class="detail"><label>Popularity</label><span>'+escapeHTML(n['Popularity Trend']||n.popularity||'Not specified')+'</span></div></div><button class="more" data-action="expand">Show details ↓</button>';
 return card;
}
function render(){
 const id=++renderId,list=filtered(),host=$('list'),loader=$('loading');
 host.replaceChildren();$('count').innerHTML='<strong>'+list.length.toLocaleString()+'</strong> names';$('state').textContent=favoritesOnly?'Saved favorites':gender==='All'?'All categories':gender;
 $('favoritesBtn').classList.toggle('active',favoritesOnly);$('exportBtn').disabled=!favorites.length;
 if(!list.length){loader.classList.remove('show');host.innerHTML='<div class="empty">'+(favoritesOnly?'No favorites saved yet. Tap ♡ on a name to save it.':'No names found. Try a different search or filter.')+'</div>';return;}
 loader.classList.add('show');let i=0;const chunk=55;
 function draw(){if(id!==renderId)return;const frag=document.createDocumentFragment();const stop=Math.min(i+chunk,list.length);for(;i<stop;i++)frag.appendChild(makeCard(list[i]));host.appendChild(frag);if(i<list.length)requestAnimationFrame(draw);else loader.classList.remove('show');}
 requestAnimationFrame(draw);
}
function setGender(g){gender=g;favoritesOnly=false;document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('active',b.dataset.gender===g));render();}
function setFav(n){const i=favorites.findIndex(f=>favMatch(f,n));if(i<0)favorites.push({...n});else favorites.splice(i,1);saveFavorites();render();}
async function copyName(n){const text=n.Name+' — '+(n.Meaning||'');try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';document.body.append(ta);ta.select();try{document.execCommand('copy');}catch{}ta.remove();} }
function exportNames(){if(!favorites.length){alert('Save some names first to export.');return;}const rows=[['Name','Gender','Meaning','Origin','Cultural Significance','Astrological Association','Popularity']];favorites.forEach(n=>rows.push([n.Name,n.Gender,n.Meaning,n.Origin,n['Cultural Significance'],n['Astrological Association'],n['Popularity Trend']||n.popularity]));const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='baby-name-favorites.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);}
function pick(){const arr=filtered();if(!arr.length){$('pickedName').textContent='No matching names';$('pickedMeaning').textContent='Adjust your search or filters first.';$('pickedGender').textContent='';randomRecord=null;return;}randomRecord=arr[Math.floor(Math.random()*arr.length)];$('pickedName').textContent=randomRecord.Name;$('pickedMeaning').textContent=randomRecord.Meaning||'Meaning not available';$('pickedGender').textContent=randomRecord.Gender||'Unisex';$('pickedFav').textContent=isFav(randomRecord)?'♥ Saved':'♡ Save';}
function openRandom(){pick();$('overlay').classList.add('show');}
function toggleTheme(){document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');$('themeBtn').textContent=dark?'☀':'☾';try{localStorage.setItem('zarnal_bbn_theme',dark?'dark':'light');}catch{}}
$('search').addEventListener('input',e=>{query=e.target.value;$('clearSearch').style.display=query?'block':'none';clearTimeout(debounce);debounce=setTimeout(render,80);});
$('clearSearch').addEventListener('click',()=>{$('search').value='';query='';$('clearSearch').style.display='none';render();$('search').focus();});
$('filters').addEventListener('click',e=>{const g=e.target.closest('[data-gender]');if(g){setGender(g.dataset.gender);return;}if(e.target.closest('#favoritesBtn')){favoritesOnly=!favoritesOnly;gender='All';document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('active',b.dataset.gender==='All'));render();return;}if(e.target.closest('#randomBtn'))openRandom();if(e.target.closest('#exportBtn'))exportNames();});
$('sort').addEventListener('change',e=>{sort=e.target.value;render();});
$('list').addEventListener('click',e=>{const card=e.target.closest('.namecard');if(!card)return;const n=names[Number(card.dataset.key)];const action=e.target.closest('[data-action]');if(action){e.preventDefault();e.stopPropagation();if(action.dataset.action==='fav')setFav(n);if(action.dataset.action==='copy')copyName(n);if(action.dataset.action==='expand'){card.classList.toggle('expanded');action.textContent=card.classList.contains('expanded')?'Hide details ↑':'Show details ↓';}return;}card.classList.toggle('expanded');const more=card.querySelector('.more');if(more)more.textContent=card.classList.contains('expanded')?'Hide details ↑':'Show details ↓';});
$('themeBtn').addEventListener('click',toggleTheme);$('closeModal').addEventListener('click',()=>$('overlay').classList.remove('show'));$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show');});$('pickAgain').addEventListener('click',pick);$('pickedFav').addEventListener('click',()=>{if(randomRecord){setFav(randomRecord);pick();}});$('pickedCopy').addEventListener('click',()=>{if(randomRecord)copyName(randomRecord);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.remove('show');});
try{if(localStorage.getItem('zarnal_bbn_theme')==='dark')document.body.classList.add('dark');}catch{}
try{const raw=JSON.parse($('babyNamesData').textContent);if(!Array.isArray(raw))throw new Error('Data is not an array');names=raw.filter(n=>n&&n.Name).map(n=>({...n,'Starting Letter':n['Starting Letter']||n.Name[0]}));$('loading').classList.add('show');render();}catch(err){console.error('Names initialization failed',err);$('loading').classList.remove('show');$('list').innerHTML='<div class="empty">Names could not load. Please refresh and try again.</div>';}
</script>
</body></html>
