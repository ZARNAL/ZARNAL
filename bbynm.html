function pop(n){return ({popular:4,rising:3,stable:2,rare:1}[String(n.popularity||n['Popularity Trend']||'').toLowerCase()]||0);}
function card(n){const c=document.createElement('article');c.className='card';c.innerHTML='<div class="cardhead"><div class="namewrap"><div class="name">'+safe(n.Name)+'</div><div class="meaning">'+safe(n.Meaning||'Meaning not available')+'</div><span class="badge '+(n.Gender||'unisex').toLowerCase()+'">'+safe(n.Gender||'Unisex')+'</span></div><button class="iconbtn heart" data-act="fav" aria-label="Save name">'+(isSaved(n)?'♥':'♡')+'</button><button class="iconbtn" data-act="copy" aria-label="Copy name">⧉</button></div><div class="details"><div class="detail"><label>Origin</label><div>'+safe(n.Origin||'Not specified')+'</div></div><div class="detail"><label>Culture</label><div>'+safe(n['Cultural Significance']||'Not specified')+'</div></div><div class="detail"><label>Astrology</label><div>'+safe(n['Astrological Association']||'Not specified')+'</div></div><div class="detail"><label>Popularity</label><div>'+safe(n['Popularity Trend']||n.popularity||'Not specified')+'</div></div></div><button class="expand" data-act="expand">Details ↓</button>';
c.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b){c.classList.toggle('open');return;}if(b.dataset.act==='fav'){toggleSaved(n);}else if(b.dataset.act==='copy'){copy(n.Name);}else{c.classList.toggle('open');b.textContent=c.classList.contains('open')?'Hide details ↑':'Details ↓';}});return c;}
async function copy(text){try{await navigator.clipboard.writeText(text);}catch{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';document.body.append(t);t.select();try{document.execCommand('copy');}catch{}t.remove();}}
function refresh(){filtered=calc();page=0;$('count').innerHTML='<strong>'+filtered.length.toLocaleString()+'</strong> names';$('filterinfo').textContent=savedOnly?'Saved':letter!=='All'?'Letter '+letter:gender==='All'?'All names':gender;$('saved').classList.toggle('selected',savedOnly);$('grid').replaceChildren();$('status').classList.remove('show');renderPage();}
function renderPage(){const grid=$('grid'),from=page*pageSize,to=Math.min(from+pageSize,filtered.length),frag=document.createDocumentFragment();for(let i=from;i<to;i++)frag.appendChild(card(filtered[i]));grid.appendChild(frag);$('more').innerHTML=to<filtered.length?'<button type="button">Show more ('+(filtered.length-to).toLocaleString()+' remaining)</button>':'';$('more').firstElementChild?.addEventListener('click',()=>{page++;renderPage();});if(!filtered.length)grid.innerHTML='<div class="empty">'+(savedOnly?'No saved names yet. Tap the ♡ to keep one.':'No matches. Try another spelling, letter or filter.')+'</div>';}
function setGender(g){gender=g;savedOnly=false;document.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('selected',b.dataset.g===g));$('saved').classList.remove('selected');refresh();}
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(b){setGender(b.dataset.g);return;}if(e.target.closest('#saved')){savedOnly=!savedOnly;gender='All';letter='All';document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('selected',x.dataset.g==='All'));document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l==='All'));refresh();}if(e.target.closest('#random'))openRandom();});
$('letters').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;letter=b.dataset.l;savedOnly=false;$('saved').classList.remove('selected');document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('active',x.dataset.l===letter));refresh();});
let debounceTimer;$('q').addEventListener('input',e=>{query=e.target.value;$('clear').style.display=query?'block':'none';clearTimeout(debounceTimer);debounceTimer=setTimeout(refresh,90);});$('clear').addEventListener('click',()=>{$('q').value='';query='';$('clear').style.display='none';refresh();$('q').focus();});
$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');const d=document.body.classList.contains('dark');$('theme').textContent=d?'☀':'◐';try{localStorage.setItem(themeKey,d?'dark':'light');}catch{}});try{if(localStorage.getItem(themeKey)==='dark'){document.body.classList.add('dark');$('theme').textContent='☀';}}catch{}
function openRandom(){if(!filtered.length){selected=null;$('picked').textContent='No matching names';$('pickedmeaning').textContent='Try changing your search or filters.';$('pickedgender').textContent='';}else{selected=filtered[Math.floor(Math.random()*filtered.length)];showPick();}$('dlg').showModal();}
function showPick(){if(!selected)return;$('picked').textContent=selected.Name;$('pickedmeaning').textContent=selected.Meaning||'Meaning not listed';$('pickedgender').textContent=selected.Gender||'Unisex';$('savepick').textContent=isSaved(selected)?'♥ Saved':'♡ Save';}
$('close').addEventListener('click',()=>$('dlg').close());$('again').addEventListener('click',openRandom);$('savepick').addEventListener('click',()=>{if(selected){toggleSaved(selected);showPick();}});$('copypick').addEventListener('click',()=>selected&&copy(selected.Name));$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('dlg').open)$('dlg').close();});
try{const parsed=JSON.parse($('data').textContent);if(!Array.isArray(parsed))throw new Error('Data format not array');all=parsed.filter(n=>n&&n.Name).map(n=>{const o={...n};o.Name=String(o.Name).trim();o['Starting Letter']=o.Name[0]?.toUpperCase()||'';return o;});refresh();}catch(err){console.error('Names loading error',err);$('status').classList.remove('show');$('grid').innerHTML='<div class="empty">Could not load the name list. Refresh this page and try again.</div>';}
})();
</script></body></html>
