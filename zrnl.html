body{transition:background .65s ease,color .55s ease}

<script>
(function(){
"use strict";
var canvas=document.getElementById("night-stars"),ctx=canvas&&canvas.getContext("2d");
if(!ctx)return;
var stars=[],w=0,h=0,dpr=1,raf=0,active=false;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);stars=[];var count=Math.min(110,Math.max(24,Math.floor(w*h/10000)));for(var i=0;i<count;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:.35+Math.random()*1.05,p:Math.random()*6.28,s:.003+Math.random()*.009});}
function draw(){if(!active)return;ctx.clearRect(0,0,w,h);for(var i=0;i<stars.length;i++){var st=stars[i];st.p+=st.s;ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fillStyle="rgba(220,220,255,"+(.18+Math.abs(Math.sin(st.p))*.52)+")";ctx.shadowBlur=4;ctx.shadowColor="#b9a6ef";ctx.fill();}ctx.shadowBlur=0;raf=requestAnimationFrame(draw);}
function setActive(){active=document.body.classList.contains("night")&&!document.hidden;if(active){cancelAnimationFrame(raf);draw();}else{cancelAnimationFrame(raf);ctx.clearRect(0,0,w,h);}}
resize();window.addEventListener("resize",resize);document.addEventListener("visibilitychange",setActive);document.addEventListener("zarnal-theme-change",setActive);setActive();
})();
</script>
<script>
(function(){
"use strict";
var btn=document.getElementById("theme-toggle");
var body=document.body;
var meta=document.querySelector('meta[name="theme-color"]');
var isNight=false;
try{isNight=localStorage.getItem("zarnal-theme")==="night";}catch(e){}
function setTheme(night){
 body.classList.toggle("night",night);
 document.dispatchEvent(new Event("zarnal-theme-change"));
 if(btn){btn.setAttribute("aria-label",night?"Switch to day mode":"Switch to night mode");btn.setAttribute("title",night?"Day mode":"Night mode");btn.setAttribute("aria-pressed",night?"true":"false");}
 if(meta)meta.setAttribute("content",night?"#191526":"#fbf8f8");
 try{localStorage.setItem("zarnal-theme",night?"night":"day");}catch(e){}
}
setTheme(isNight);
if(btn){btn.addEventListener("click",function(){setTheme(!body.classList.contains("night"));});}
})();
</script>
