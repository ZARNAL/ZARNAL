function drawStars(t){for(var i=0;i<stars.length;i++){var s=stars[i],blink=(Math.sin(t*s.speed+s.phase)+1)/2,a=s.base+blink*.26,r=s.r*(.82+blink*.3);ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fillStyle=s.tone>.78?"rgba(225,207,255,"+Math.min(.98,a)+")":"rgba(242,244,255,"+Math.min(.96,a)+")";ctx.shadowBlur=s.tone>.78?4:2;ctx.shadowColor=s.tone>.78?"rgba(207,180,255,.65)":"rgba(210,225,255,.5)";ctx.fill();}ctx.shadowBlur=0;}
function launchComet(t){if(comet||t<nextComet)return;var startX=rand(w*.62,w*1.08),startY=rand(h*.04,h*.52),length=rand(105,165),speed=rand(180,245);comet={x:startX,y:startY,vx:-speed,vy:speed*.48,life:0,duration:rand(.85,1.15),length:length};nextComet=t+rand(1.8,2.4)*1000;}
function drawComet(dt,t){launchComet(t);if(!comet)return;comet.life+=dt;var p=Math.min(1,comet.life/comet.duration),fade=Math.sin(Math.PI*p);var x=comet.x+comet.vx*comet.life,y=comet.y+comet.vy*comet.life,tailScale=comet.length/Math.sqrt(comet.vx*comet.vx+comet.vy*comet.vy),tx=x-comet.vx*tailScale,ty=y-comet.vy*tailScale;ctx.save();ctx.globalAlpha=fade*.78;var g=ctx.createLinearGradient(tx,ty,x,y);g.addColorStop(0,"rgba(210,190,255,0)");g.addColorStop(.7,"rgba(220,208,255,.2)");g.addColorStop(1,"rgba(255,255,255,.9)");ctx.strokeStyle=g;ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,1.7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.shadowBlur=9;ctx.shadowColor="#d6c1ff";ctx.fill();ctx.restore();if(p>=1)comet=null;}

function frame(t){if(!active)return;var dt=last?Math.min((t-last)/1000,.05):0;last=t;ctx.clearRect(0,0,w,h);drawStars(t);if(!reduced)drawComet(dt,t);raf=requestAnimationFrame(frame);}
function update(){active=document.body.classList.contains("night")&&!document.hidden&&!reduced;if(active){last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}else{cancelAnimationFrame(raf);ctx.clearRect(0,0,w,h)}}
resize();window.addEventListener("resize",resize);document.addEventListener("visibilitychange",update);document.addEventListener("zarnal-theme-change",update);update();
})();
</script><script>
(function(){
"use strict";
var btn=document.getElementById("theme-toggle");
var body=document.body;
var meta=document.querySelector('meta[name="theme-color"]');
var isNight=false;
try{isNight=localStorage.getItem("zarnal-theme")==="night";}catch(e){}
function setTheme(night){
 body.classList.toggle("night",night);
 document.dispatchEvent(new Event("zarnal-theme-change"));
 if(btn){btn.setAttribute("aria-label",night?"Switch to day mode":"Switch to night mode");btn.setAttribute("title",night?"Day mode":"Night mode");btn.setAttribute("aria-pressed",night?"true":"false");}
 if(meta)meta.setAttribute("content",night?"#191526":"#fbf8f8");
 try{localStorage.setItem("zarnal-theme",night?"night":"day");}catch(e){}
}
setTheme(isNight);
if(btn){btn.addEventListener("click",function(){setTheme(!body.classList.contains("night"));});}
})();
</script>
