:root{color-scheme:light;--bg:#fff7fa;--text:#252229;--muted:#817981;--accent:#c45c7b;--surface:rgba(255,255,255,.82);--border:rgba(124,74,91,.10);--shadow:0 8px 28px rgba(66,35,48,.055);--radius:24px;--header-bg:rgba(255,252,253,.78);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html{min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);background-image:radial-gradient(ellipse at 0 0,rgba(255,166,196,.16),transparent 42%),radial-gradient(ellipse at 100% 18%,rgba(207,187,255,.14),transparent 38%),radial-gradient(ellipse at 50% 100%,rgba(255,222,202,.10),transparent 44%);display:flex;flex-direction:column;overflow-x:hidden;transition:background-color .45s var(--ease),color .35s var(--ease)}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9999;transition:opacity .3s ease,visibility .3s;visibility:visible}#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}.spinner{width:28px;height:28px;border:2px solid rgba(196,92,123,.16);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:10;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:9px;min-height:64px;padding:10px 60px;background:var(--header-bg);border-bottom:1px solid var(--border);color:var(--text);font-weight:700;font-size:1.08rem;letter-spacing:.055em;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);transition:background .4s,border-color .35s,color .35s}
.header-logo{width:34px;height:34px;object-fit:contain;border-radius:10px;flex-shrink:0;box-shadow:0 1px 5px rgba(25,15,30,.05)}.header-title{line-height:1}
main{width:100%;max-width:1200px;margin:0 auto;padding:clamp(16px,3.5vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(13px,2vw,20px);align-content:start}
.card{min-width:0;width:100%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:clamp(12px,2.4vw,22px);border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);text-decoration:none;color:inherit;text-align:center;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s,background .4s;animation:cardEnter .42s var(--ease) both}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(145deg,rgba(255,255,255,.55),transparent 50%);opacity:.45}.card:focus-visible{outline:3px solid rgba(196,92,123,.55);outline-offset:3px}.card:active{transform:scale(.965);transition-duration:.12s}
.card .icon{width:clamp(56px,6vw,70px);height:clamp(56px,6vw,70px);display:grid;place-items:center;border-radius:21px;background:linear-gradient(145deg,#fff,#f8eef2);font-size:clamp(1.9rem,4vw,2.45rem);line-height:1;position:relative;z-index:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transition:transform .3s,background .35s}
.card .label{font-size:clamp(.88rem,1.5vw,.98rem);font-weight:600;line-height:1.35;letter-spacing:-.018em;overflow-wrap:anywhere;position:relative;z-index:1;color:#42343b;transition:color .35s}
@keyframes cardEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.card:nth-child(2){animation-delay:.025s}.card:nth-child(3){animation-delay:.05s}.card:nth-child(4){animation-delay:.075s}.card:nth-child(5){animation-delay:.1s}.card:nth-child(6){animation-delay:.125s}.card:nth-child(7){animation-delay:.15s}.card:nth-child(8){animation-delay:.175s}.card:nth-child(9){animation-delay:.2s}.card:nth-child(10){animation-delay:.225s}.card:nth-child(11){animation-delay:.25s}.card:nth-child(12){animation-delay:.275s}.card:nth-child(13){animation-delay:.3s}.card:nth-child(14){animation-delay:.325s}.card:nth-child(15){animation-delay:.35s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(66,35,48,.085);border-color:rgba(196,92,123,.16)}.card:hover .icon{transform:scale(1.045)}}
#gif-box{grid-column:1/-1;width:100%;margin:8px 0 22px;text-align:center;animation:cardEnter .5s ease both}#random-gif{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);background:var(--surface)}#random-gif[hidden]{display:none}
.theme-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.65);color:#9c5c73;box-shadow:0 2px 8px rgba(35,20,30,.04);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s,background .35s,border-color .35s,color .35s,box-shadow .35s}.theme-toggle:active{transform:translateY(-50%) scale(.92)}.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.theme-toggle .toggle-moon,.theme-toggle .toggle-sun{position:absolute;display:block;font-size:16px;line-height:1;transition:opacity .25s,transform .42s}.theme-toggle .toggle-moon{opacity:1;transform:rotate(0) scale(1)}.theme-toggle .toggle-sun{opacity:0;transform:rotate(-70deg) scale(.7)}
body.night{color-scheme:dark;--bg:#09080d;--text:#f5f2f8;--muted:#a4a0ae;--accent:#c8a7f0;--surface:rgba(26,23,33,.72);--border:rgba(255,255,255,.12);--shadow:0 16px 44px rgba(0,0,0,.32);--header-bg:rgba(12,10,20,.76);background-color:#09080d;background-image:radial-gradient(ellipse at 15% 0%,rgba(89,13,34,.24),transparent 43%),radial-gradient(ellipse at 90% 28%,rgba(60,9,108,.22),transparent 40%),radial-gradient(ellipse at 55% 100%,rgba(128,15,47,.12),transparent 48%),linear-gradient(180deg,#09080d,#100b17 70%,#09080d)}
body.night .card{background:linear-gradient(150deg,rgba(32,28,42,.83),rgba(26,23,33,.72));border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.26);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}body.night .card:before{background:radial-gradient(circle at 50% 0%,rgba(215,184,255,.12),transparent 68%);opacity:1}body.night .card .icon{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}body.night .card .label{color:#f7efff}body.night #random-gif{border-color:rgba(255,255,255,.12);box-shadow:0 10px 32px rgba(0,0,0,.22)}body.night #loader{background:#09080d}body.night .spinner{border-color:rgba(255,255,255,.12);border-top-color:#c8a7f0}body.night .theme-toggle{background:rgba(26,23,33,.78);border-color:rgba(255,255,255,.12);color:#e5c9f7;box-shadow:inset 0 1px 1px rgba(255,255,255,.1),0 3px 12px rgba(0,0,0,.22)}body.night .theme-toggle .toggle-moon{opacity:0;transform:rotate(70deg) scale(.7)}body.night .theme-toggle .toggle-sun{opacity:1;transform:rotate(0) scale(1)}
@media(max-width:600px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}.card{border-radius:22px;gap:12px}.card .icon{width:clamp(52px,13vw,62px);height:clamp(52px,13vw,62px);border-radius:18px}.card .label{font-size:.88rem}body.night .card{background:linear-gradient(150deg,rgba(32,28,42,.83),rgba(26,23,33,.72));backdrop-filter:blur(10px) saturate(130%);-webkit-backdrop-filter:blur(10px) saturate(130%)}}

main{max-width:1080px;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:clamp(14px,2.2vw,22px);padding:clamp(18px,4vw,38px)}

<script>
(function(){
"use strict";
var btn=document.getElementById("theme-toggle");
var body=document.body;
var meta=document.querySelector('meta[name="theme-color"]');
var isNight=false;
try{isNight=localStorage.getItem("zarnal-theme")==="night";}catch(e){}
function setTheme(night){
 body.classList.toggle("night",night);
 document.dispatchEvent(new Event("zarnal-theme-change"));
 if(btn){btn.setAttribute("aria-label",night?"Switch to day mode":"Switch to night mode");btn.setAttribute("title",night?"Day mode":"Night mode");btn.setAttribute("aria-pressed",night?"true":"false");}
 if(meta)meta.setAttribute("content",night?"#191526":"#fbf8f8");
 try{localStorage.setItem("zarnal-theme",night?"night":"day");}catch(e){}
}
setTheme(isNight);
if(btn){btn.addEventListener("click",function(){setTheme(!body.classList.contains("night"));});}
})();
</script>
