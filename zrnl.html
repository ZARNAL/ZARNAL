<title>Zarnal</title>

<style>
:root{--rose:#b84b69;--rose-deep:#a53c5b;--rose-soft:#f9e9ee;--bg:#fbf8f8;--text:#29242a;--muted:#84777e;--card:#fffdfd;--border:rgba(154,74,99,.09);--shadow:0 5px 24px rgba(92,44,62,.045);--radius:24px}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(ellipse at 0% 0%,rgba(246,218,228,.42),transparent 42%),radial-gradient(ellipse at 100% 24%,rgba(247,232,218,.35),transparent 35%),var(--bg);color:var(--text);display:flex;flex-direction:column;overflow-x:hidden}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .38s ease}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:32px;height:32px;border:3px solid #eadce1;border-top-color:var(--rose);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;color:#35252c;font-weight:750;font-size:clamp(1.1rem,4vw,1.35rem);letter-spacing:.04em;background:rgba(255,252,252,.78);border-bottom:1px solid rgba(155,76,102,.07);box-shadow:0 2px 12px rgba(80,40,54,.025);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.header-logo{width:clamp(32px,7vw,40px);height:clamp(32px,7vw,40px);object-fit:contain;border-radius:11px;flex-shrink:0;box-shadow:0 2px 8px rgba(80,40,54,.06)}
.header-title{line-height:1}
main{width:100%;max-width:1160px;margin:0 auto;padding:clamp(14px,3.5vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:clamp(12px,2.2vw,20px);align-content:start}
@media(max-width:600px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px;gap:12px}}
.intro{grid-column:1/-1;padding:clamp(8px,2vw,18px) 2px clamp(5px,1.5vw,12px);animation:softReveal .7s cubic-bezier(.2,.7,.2,1) both}
.intro h1{margin:0;color:#3a2930;font-size:clamp(1.65rem,5.6vw,2.5rem);font-weight:720;letter-spacing:-.055em;line-height:1.12}
.intro p{margin:9px 0 0;color:var(--muted);font-size:clamp(.88rem,2.5vw,.98rem);font-weight:450;line-height:1.55;letter-spacing:.005em}
.card{min-width:0;width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vw,14px);padding:clamp(12px,3vw,22px);border:1px solid var(--border);border-radius:clamp(20px,3.2vw,27px);background:linear-gradient(150deg,rgba(255,255,255,.98),rgba(255,250,251,.96));box-shadow:0 2px 9px rgba(88,44,60,.025),0 8px 26px rgba(88,44,60,.035);text-decoration:none;color:inherit;text-align:center;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .32s cubic-bezier(.2,.7,.2,1),box-shadow .32s ease,border-color .32s ease,background .32s ease;animation:softReveal .55s cubic-bezier(.2,.7,.2,1) both}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(247,220,230,.42),transparent 65%);opacity:.65;pointer-events:none}
.card:after{content:"";position:absolute;top:-80%;left:-50%;width:55%;height:250%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.62),transparent);transform:rotate(24deg);opacity:0;transition:opacity .3s ease,left .65s ease;pointer-events:none}
.card:focus-visible{outline:3px solid rgba(184,75,105,.65);outline-offset:3px}
.card:active{transform:scale(.965);box-shadow:0 2px 8px rgba(125,54,78,.07)}
.card .icon{font-size:clamp(1.8rem,6.5vw,2.75rem);line-height:1;display:grid;place-items:center;width:clamp(54px,13vw,68px);height:clamp(54px,13vw,68px);border-radius:21px;background:linear-gradient(145deg,#fff,#f9edf1);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 12px rgba(123,60,82,.055);position:relative;z-index:1;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.card .label{font-size:clamp(.84rem,2.4vw,.98rem);font-weight:620;line-height:1.35;overflow-wrap:anywhere;letter-spacing:-.015em;position:relative;z-index:1;color:#45343b}
@media(hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(125,54,78,.09);border-color:rgba(184,75,105,.15);background:#fff}.card:hover:after{opacity:1;left:130%}.card:hover .icon{transform:translateY(-2px) scale(1.045)}}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.20s}.card:nth-child(7){animation-delay:.24s}.card:nth-child(8){animation-delay:.28s}.card:nth-child(9){animation-delay:.32s}.card:nth-child(10){animation-delay:.36s}.card:nth-child(11){animation-delay:.4s}.card:nth-child(12){animation-delay:.44s}.card:nth-child(13){animation-delay:.48s}.card:nth-child(14){animation-delay:.52s}.card:nth-child(15){animation-delay:.56s}.card:nth-child(16){animation-delay:.6s}
#gif-box{grid-column:1/-1;width:100%;margin:10px 0 20px;text-align:center;animation:softReveal .7s ease both}
#random-gif{display:block;width:100%;height:auto;max-height:440px;object-fit:contain;border-radius:clamp(20px,3.2vw,27px);box-shadow:0 5px 22px rgba(88,44,60,.055);border:1px solid rgba(154,74,99,.06)}
#random-gif[hidden]{display:none}
@keyframes softReveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
