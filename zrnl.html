body{background-color:#fff6f9;background-image:radial-gradient(ellipse at 0% 0%,rgba(255,158,187,.16),transparent 42%),radial-gradient(ellipse at 100% 24%,rgba(208,191,255,.17),transparent 38%),radial-gradient(ellipse at 52% 100%,rgba(255,216,190,.12),transparent 45%);transition:background .6s ease,color .4s ease}
header{background:rgba(255,252,252,.78);color:#35252c;border-bottom-color:rgba(255,122,162,.1)}
.card{background:linear-gradient(150deg,rgba(255,255,255,.94),rgba(255,250,251,.88))!important;border-color:rgba(255,255,255,.85)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 8px 26px rgba(88,44,60,.045)!important}
.card .icon{background:linear-gradient(145deg,#fff,#f9edf1)!important}
.card .label{color:#45343b!important}
.theme-toggle{width:52px;height:30px;border-radius:999px;right:14px;top:50%;padding:0;border:1px solid rgba(255,122,162,.22);background:rgba(255,255,255,.82);box-shadow:inset 0 1px 1px rgba(255,255,255,.85),0 3px 12px rgba(0,0,0,.055);color:#fff;position:absolute;overflow:hidden}
.theme-toggle:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#ff2d55,#ff85a1);box-shadow:0 2px 6px rgba(255,45,85,.28);transition:transform .38s cubic-bezier(.34,1.56,.64,1);z-index:1}
.theme-toggle .toggle-moon,.theme-toggle .toggle-sun{font-size:12px;line-height:1;position:absolute;z-index:2;top:50%;left:8px;transform:translateY(-50%);transition:opacity .28s ease,transform .38s cubic-bezier(.34,1.56,.64,1)}
.theme-toggle .toggle-moon{opacity:1}
.theme-toggle .toggle-sun{opacity:0}
body.night{color:#f5f5f7;background-color:#09080d;background-image:radial-gradient(ellipse at 15% 0%,rgba(89,13,34,.24),transparent 43%),radial-gradient(ellipse at 90% 28%,rgba(60,9,108,.22),transparent 40%),radial-gradient(ellipse at 55% 100%,rgba(128,15,47,.12),transparent 48%),linear-gradient(180deg,#09080d,#100b17 70%,#09080d);--text:#f5f5f7;--muted:#a1a1a6;--bg:#09080d;--card:rgba(26,23,33,.72);--border:rgba(255,255,255,.12);--shadow:0 24px 60px rgba(0,0,0,.58)}
body.night header{background:rgba(12,10,20,.76);color:#fff;border-bottom-color:rgba(255,255,255,.08)}
body.night .card{background:linear-gradient(150deg,rgba(32,28,42,.83),rgba(26,23,33,.72))!important;border-color:rgba(255,255,255,.12)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 30px rgba(0,0,0,.26)!important}
body.night .card:before{background:radial-gradient(circle at 50% 0%,rgba(215,184,255,.12),transparent 68%)!important}
body.night .card .icon{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035))!important;border-color:rgba(255,255,255,.07)}
body.night .card .label{color:#f7efff!important}
body.night .theme-toggle{background:rgba(26,23,33,.78);border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 1px rgba(255,255,255,.1),0 3px 12px rgba(0,0,0,.22)}
body.night .theme-toggle:before{transform:translateX(22px);background:linear-gradient(135deg,#5e5ce6,#ad46ff);box-shadow:0 2px 7px rgba(120,75,220,.35)}
body.night .theme-toggle .toggle-moon{opacity:0;transform:translateY(-50%) rotate(-80deg) scale(.7)}
body.night .theme-toggle .toggle-sun{opacity:1;left:30px;transform:translateY(-50%) rotate(0) scale(1)}
@media(max-width:360px){.theme-toggle{right:9px;width:48px;height:28px}.theme-toggle:before{width:20px;height:20px}.body.night .theme-toggle:before{transform:translateX(20px)}}
@media(prefers-reduced-motion:reduce){.theme-toggle:before,.theme-toggle span{transition:none!important}}

/* Exact reference night palette — no stars, twinkles, or shooting-star effects */
body.night{background-color:#09080d!important;background-image:radial-gradient(ellipse at 15% 0%,rgba(89,13,34,.24),transparent 43%),radial-gradient(ellipse at 90% 28%,rgba(60,9,108,.22),transparent 40%),radial-gradient(ellipse at 55% 100%,rgba(128,15,47,.12),transparent 48%),linear-gradient(180deg,#09080d,#100b17 70%,#09080d)!important;color:#f5f5f7!important}
body.night{--text:#f5f5f7;--muted:#a1a1a6;--bg:#09080d;--card:rgba(26,23,33,.72);--border:rgba(255,255,255,.12);--shadow:0 24px 60px rgba(0,0,0,.7),0 0 40px rgba(255,45,85,.1)}
body.night header{background:rgba(12,10,20,.76)!important;color:#fff!important;border-bottom-color:rgba(255,255,255,.08)!important}
body.night .card{background:rgba(26,23,33,.72)!important;border-color:rgba(255,255,255,.12)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.15),0 24px 60px rgba(0,0,0,.45)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}
body.night .card .icon{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.1)!important}
body.night .card .label{color:#f5f5f7!important}
#night-stars,.night-shooting-star,[class*="star"],[class*="shooting"]{display:none!important;opacity:0!important;animation:none!important}
@media(prefers-reduced-motion:reduce){body,body.night,header,.card{transition:none!important}}

(function(){
"use strict";
var btn=document.getElementById("theme-toggle");
var body=document.body;
var meta=document.querySelector('meta[name="theme-color"]');
var isNight=false;
try{isNight=localStorage.getItem("zarnal-theme")==="night";}catch(e){}
function setTheme(night){
 body.classList.toggle("night",night);
 document.dispatchEvent(new Event("zarnal-theme-change"));
 if(btn){btn.setAttribute("aria-label",night?"Switch to day mode":"Switch to night mode");btn.setAttribute("title",night?"Day mode":"Night mode");btn.setAttribute("aria-pressed",night?"true":"false");}
 if(meta)meta.setAttribute("content",night?"#191526":"#fbf8f8");
 try{localStorage.setItem("zarnal-theme",night?"night":"day");}catch(e){}
}
setTheme(isNight);
if(btn){btn.addEventListener("click",function(){setTheme(!body.classList.contains("night"));});}
})();
</script>
