<style>
:root{--accent:#ff4778;--bg:#fff;--text:#18181b;--muted:#626269;--card:#fff;--border:rgba(20,20,30,.06);--shadow:0 5px 22px rgba(20,20,30,.07);--radius:22px}
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow-x:hidden}
#loader{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .25s ease}
#loader.hidden{opacity:0;pointer-events:none}
.spinner{width:42px;height:42px;border:4px solid #f3e8ed;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{position:sticky;top:0;z-index:10;text-align:center;padding:17px 12px;color:#fff;font-weight:700;font-size:clamp(1.15rem,4vw,1.5rem);background:linear-gradient(135deg,#ff3366,#ff8db1);border-radius:0 0 24px 24px;box-shadow:0 4px 16px rgba(255,51,102,.13)}
main{width:100%;max-width:900px;margin:0 auto;padding:clamp(12px,3vw,24px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.5vw,18px);align-content:start;animation:fadeIn .35s ease both}
.card{min-width:0;width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,2vw,13px);padding:clamp(10px,3vw,20px);border:1px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:inherit;text-align:center;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card:active{transform:scale(.97)}
.card .icon{font-size:clamp(1.8rem,7vw,3rem);line-height:1;display:block}
.card .label{font-size:clamp(.85rem,3.4vw,1.05rem);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
@media(hover:hover){.card:hover{transform:translateY(-3px);background:#fff5f8;box-shadow:0 10px 28px rgba(255,51,102,.11)}}
#gif-box{grid-column:1/-1;width:100%;margin:6px 0 12px;text-align:center}
#random-gif{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;border-radius:var(--radius);box-shadow:var(--shadow)}
#random-gif[hidden]{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
