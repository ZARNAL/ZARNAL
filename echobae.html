<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>💖 Alexa Cute Whisper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Light Mode — Apple Rose Quartz & Liquid Glass */
  --bg-base: #fff6f9;
  --orb-1: #ff9ebb;
  --orb-2: #ffc2d4;
  --orb-3: #d0bfff;
  --orb-4: #ffd8be;
  --glass-bg: rgba(255, 255, 255, 0.72);
  --glass-bg-strong: rgba(255, 255, 255, 0.86);
  --glass-border: rgba(255, 255, 255, 0.9);
  --glass-inner-glow: inset 0 1px 1px rgba(255, 255, 255, 0.95);
  --glass-shadow: 0 24px 60px rgba(255, 77, 128, 0.14), 0 4px 16px rgba(0, 0, 0, 0.04);
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --accent: #ff2d55;
  --accent-gradient: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 55%, #ff85a1 100%);
  --accent-glow: rgba(255, 45, 85, 0.32);
  --chip-bg: rgba(255, 255, 255, 0.78);
  --chip-hover: rgba(255, 45, 85, 0.1);
  --chip-border: rgba(255, 122, 162, 0.22);
  --input-bg: rgba(255, 255, 255, 0.9);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

.dark {
  /* Dark Mode — Apple Midnight Velvet & Crimson Glow */
  --bg-base: #09080d;
  --orb-1: #590d22;
  --orb-2: #3c096c;
  --orb-3: #800f2f;
  --orb-4: #240046;
  --glass-bg: rgba(26, 23, 33, 0.68);
  --glass-bg-strong: rgba(32, 28, 42, 0.86);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-inner-glow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 28px 70px rgba(0, 0, 0, 0.7), 0 0 45px rgba(255, 45, 85, 0.12);
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --accent: #ff375f;
  --accent-gradient: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 50%, #c77dff 100%);
  --accent-glow: rgba(255, 55, 95, 0.45);
  --chip-bg: rgba(255, 255, 255, 0.07);
  --chip-hover: rgba(255, 55, 95, 0.22);
  --chip-border: rgba(255, 255, 255, 0.1);
  --input-bg: rgba(14, 12, 18, 0.75);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
  background-color: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  transition: background-color 0.6s var(--smooth), color 0.4s var(--smooth);
}

/* Living Aurora Background */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.62;
  animation: drift 20s infinite alternate ease-in-out;
  transition: background 0.8s ease;
}

.orb-1 { width: 440px; height: 440px; background: var(--orb-1); top: -12%; left: -10%; animation-duration: 17s; }
.orb-2 { width: 400px; height: 400px; background: var(--orb-2); bottom: -12%; right: -8%; animation-duration: 22s; animation-delay: -5s; }
.orb-3 { width: 340px; height: 340px; background: var(--orb-3); top: 32%; left: 58%; animation-duration: 19s; animation-delay: -9s; }
.orb-4 { width: 300px; height: 300px; background: var(--orb-4); bottom: 20%; left: 8%; animation-duration: 25s; animation-delay: -3s; }

@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(50px, -40px) scale(1.12); }
  100% { transform: translate(-40px, 45px) scale(0.93); }
}

/* Floating Ambient Hearts */
.heart {
  position: fixed;
  bottom: -30px;
  width: 14px;
  height: 14px;
  background: var(--accent-gradient);
  transform: rotate(45deg);
  animation: floatUp linear infinite;
  z-index: 1;
  pointer-events: none;
  filter: drop-shadow(0 0 8px var(--accent-glow));
}

.heart::before, .heart::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: inherit;
  border-radius: 50%;
}

.heart::before { top: -50%; left: 0; }
.heart::after { left: -50%; top: 0; }

@keyframes floatUp {
  0% { transform: translateY(0) rotate(45deg) scale(0.6); opacity: 0; }
  15% { opacity: 0.5; }
  85% { opacity: 0.4; }
  100% { transform: translateY(-112vh) rotate(90deg) scale(1.1); opacity: 0; }
}

/* Sparkle Particle Burst */
.sparkle-particle {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  font-size: 16px;
  user-select: none;
  animation: particleFly 0.85s var(--smooth) forwards;
}

@keyframes particleFly {
  0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.25) rotate(var(--rot)); opacity: 0; }
}

/* Apple Dynamic Island Notification Pill */
.dynamic-island {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%) scale(0.92);
  background: rgba(18, 18, 22, 0.9);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: #fff;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28), 0 0 20px var(--accent-glow);
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  z-index: 10002;
  opacity: 0;
  pointer-events: none;
  white-space: nowrap;
  transition: transform 0.45s var(--spring), opacity 0.3s ease, padding 0.35s var(--spring);
}

.dynamic-island.active {
  opacity: 1;
  transform: translateX(-50%) scale(1);
  padding: 10px 22px;
}

.island-pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff2d55;
  box-shadow: 0 0 10px #ff2d55;
  animation: pulseDot 1.2s infinite ease-in-out;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.4); opacity: 0.6; }
}

/* Top Navigation: Apple Glass Back Button */
.back-arrow {
  position: fixed;
  top: 18px;
  left: 18px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), 0 8px 24px rgba(0, 0, 0, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: transform 0.35s var(--spring), background 0.3s ease, box-shadow 0.3s ease;
  z-index: 10001;
}

.back-arrow:hover {
  transform: scale(1.1) translateX(-2px);
  background: var(--accent);
  box-shadow: 0 10px 25px var(--accent-glow);
}

.back-arrow:active { transform: scale(0.92); }

.back-arrow svg {
  width: 20px;
  height: 20px;
  fill: var(--text-primary);
  transition: fill 0.3s ease;
}

.back-arrow:hover svg { fill: #fff; }

/* Apple iOS Dark Mode Toggle Switch */
.switch-container {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 10000;
}

.switch {
  position: relative;
  display: inline-block;
  width: 62px;
  height: 34px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--glass-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 34px;
  box-shadow: var(--glass-inner-glow), 0 8px 24px rgba(0, 0, 0, 0.08);
  transition: 0.4s var(--smooth);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 7px;
  font-size: 13px;
}

.slider::after {
  content: "☀️";
  margin-left: auto;
  opacity: 0.8;
}

input:checked + .slider::after {
  content: "🌙";
  margin-left: 0;
  margin-right: auto;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 3px;
  bottom: 3px;
  background: var(--accent-gradient);
  border-radius: 50%;
  box-shadow: 0 3px 10px var(--accent-glow);
  transition: transform 0.45s var(--spring);
  z-index: 2;
}

input:checked + .slider:before {
  transform: translateX(28px);
}

/* Simple & Elegant Secret Code Overlays */
#codeOverlay, #secretMessageOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 244, 248, 0.45);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 20px;
  transition: opacity 0.4s var(--smooth), transform 0.4s var(--smooth);
}

.dark #codeOverlay, .dark #secretMessageOverlay {
  background: rgba(9, 8, 13, 0.65);
}

.lock-card {
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  border-radius: 28px;
  padding: 34px 28px 30px;
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: cardPopIn 0.55s var(--spring);
}

.lock-card h3 {
  font-size: 21px;
  font-weight: 700;
  margin-bottom: 18px;
  letter-spacing: -0.02em;
}

@keyframes cardPopIn {
  0% { opacity: 0; transform: scale(0.92) translateY(14px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

#codeOverlay input, #secretMessageOverlay input {
  width: 220px;
  padding: 13px 16px;
  font-size: 16px;
  font-weight: 500;
  border-radius: 14px;
  border: 1.5px solid var(--chip-border);
  background: var(--input-bg);
  color: var(--text-primary);
  text-align: center;
  margin-bottom: 14px;
  outline: none;
  transition: all 0.25s var(--smooth);
}

#codeOverlay input::placeholder, #secretMessageOverlay input::placeholder {
  color: var(--text-secondary);
  font-weight: 400;
}

#codeOverlay input:focus, #secretMessageOverlay input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow);
  transform: translateY(-1px);
}

#codeOverlay button, #secretMessageOverlay button {
  margin-top: 2px;
  padding: 11px 28px;
  font-size: 15.5px;
  font-weight: 600;
  border-radius: 999px;
}

.shake {
  animation: appleShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

@keyframes appleShake {
  10%, 90% { transform: translateX(-4px); }
  20%, 80% { transform: translateX(8px); }
  30%, 50%, 70% { transform: translateX(-10px); }
  40%, 60% { transform: translateX(10px); }
}

#codeError, #secretMessageError {
  color: #ff3b30;
  margin-top: 12px;
  display: none;
  font-size: 13px;
  font-weight: 600;
}

#secretMessageDisplay {
  display: none;
  margin-top: 16px;
  padding: 14px;
  border-radius: 16px;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  font-size: 14.5px;
  color: var(--accent);
  font-weight: 600;
  word-break: break-word;
  line-height: 1.5;
  animation: cardPopIn 0.4s var(--spring);
}

/* Main Apple Frosted Glass Card */
.container {
  background: var(--glass-bg);
  backdrop-filter: blur(36px) saturate(190%);
  -webkit-backdrop-filter: blur(36px) saturate(190%);
  border-radius: 34px;
  padding: 32px 26px;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  text-align: center;
  max-width: 580px;
  margin: 68px auto 22px;
  z-index: 2;
  position: relative;
  display: none;
  animation: cardPopIn 0.65s var(--spring);
}

.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 13px;
  border-radius: 999px;
  background: var(--chip-hover);
  border: 1px solid var(--chip-border);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #30d158;
  box-shadow: 0 0 8px #30d158;
}

h2, h3 {
  font-size: 27px;
  letter-spacing: -0.03em;
  margin-bottom: 18px;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}

/* Sleek Textarea Input with Quick Clear Button */
.textarea-wrapper {
  position: relative;
  margin: 10px 0 18px;
}

textarea {
  width: 100%;
  height: 108px;
  padding: 16px 40px 16px 18px;
  font-size: 16px;
  font-family: inherit;
  font-weight: 500;
  line-height: 1.45;
  color: var(--text-primary);
  border: 1.5px solid var(--chip-border);
  border-radius: 22px;
  background: var(--input-bg);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03);
  resize: none;
  outline: none;
  transition: all 0.3s var(--smooth);
}

textarea::placeholder {
  color: var(--text-secondary);
  font-weight: 400;
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-glow), inset 0 2px 6px rgba(0, 0, 0, 0.02);
  transform: translateY(-1px);
}

.clear-text-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  padding: 0;
  margin: 0;
  background: rgba(142, 142, 147, 0.2);
  color: var(--text-secondary);
  border: none;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: none;
  opacity: 0.7;
  transition: all 0.25s var(--spring);
}

.clear-text-btn:hover {
  background: var(--accent);
  color: #fff;
  opacity: 1;
  transform: scale(1.1);
  box-shadow: none;
}

/* Tactile Apple Soundboard Pills */
.preset-section-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 10px;
}

.preset-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 10px 0 22px;
}

.preset-buttons button, .preset-buttons a {
  margin-top: 0;
  background: var(--chip-bg);
  color: var(--text-primary);
  padding: 9px 15px;
  border: 1px solid var(--chip-border);
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  box-shadow: var(--glass-inner-glow), 0 2px 8px rgba(0, 0, 0, 0.04);
  transition: transform 0.3s var(--spring), background 0.25s ease, color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.preset-buttons button:hover,
.preset-buttons button.active-chip,
.preset-buttons a:hover {
  background: var(--accent-gradient);
  color: #fff;
  border-color: transparent;
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 8px 20px var(--accent-glow);
}

.preset-buttons button:active, .preset-buttons a:active {
  transform: scale(0.92);
}

/* Primary Whisper Action Button */
button {
  margin-top: 8px;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  background: var(--accent-gradient);
  color: white;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 10px 25px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
  transition: transform 0.35s var(--spring), box-shadow 0.3s ease, filter 0.3s ease;
}

button:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 30px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.45);
  filter: brightness(1.05);
}

button:active {
  transform: scale(0.95);
}

#sendToAlexaBtn {
  width: 100%;
  max-width: 310px;
  margin: 4px auto 0;
}

#status {
  margin-top: 12px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-secondary);
  min-height: 20px;
  transition: all 0.3s ease;
}

/* Apple iOS Lock Screen Widget Countdowns */
.widgets-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
  gap: 12px;
  margin-top: 16px;
}

#birthdayCountdownContainer, #anniversaryCountdownContainer {
  display: none;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 22px;
  padding: 15px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--glass-inner-glow), 0 8px 20px rgba(0, 0, 0, 0.04);
  transition: transform 0.35s var(--spring), box-shadow 0.3s ease;
}

#birthdayCountdownContainer:hover, #anniversaryCountdownContainer:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 12px 26px var(--accent-glow);
}

#birthdayCountdownMessage, #anniversaryCountdownMessage, #birthdayMessage, #anniversaryMessage {
  font-size: 14.5px;
  color: var(--accent);
  font-weight: 700;
  line-height: 1.45;
}

/* Special Event Media Cards */
#birthdayContainer, #anniversaryContainer {
  text-align: center;
  margin-top: 18px;
  padding: 18px;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 26px;
  box-shadow: var(--glass-inner-glow), 0 12px 28px rgba(0, 0, 0, 0.06);
  display: none;
  animation: cardPopIn 0.6s var(--spring);
}

#birthdayImage, #anniversaryImage, #birthdayVideo, #birthdayVideo {
  max-width: 100%;
  max-height: 360px;
  height: auto;
  margin: 10px auto;
  display: none;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
  border-radius: 18px;
  transition: transform 0.35s var(--spring);
  object-fit: cover;
}

#birthdayImage:hover, #anniversaryImage:hover, #birthdayVideo:hover {
  transform: scale(1.02);
}

#birthdayAudio, #anniversaryAudio {
  margin: 12px auto;
  width: 100%;
  max-width: 320px;
  display: none;
  border-radius: 999px;
}

/* Interactive Apple Live Sticker Random GIF Frame */
#randomGifContainer {
  text-align: center;
  margin: 20px auto 34px;
  display: none;
  position: relative;
  z-index: 2;
  width: fit-content;
}

.gif-glass-frame {
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(190%);
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  padding: 15px 15px 11px;
  border-radius: 30px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.4s var(--spring), box-shadow 0.3s ease;
}

.gif-glass-frame:hover {
  transform: translateY(-6px) scale(1.04) rotate(1deg);
  box-shadow: 0 24px 48px var(--accent-glow);
}

.gif-glass-frame:active {
  transform: scale(0.93);
}

#randomGif {
  width: 150px;
  height: 150px;
  border-radius: 20px;
  object-fit: contain;
  transition: transform 0.32s var(--spring), opacity 0.22s ease, filter 0.22s ease;
}

.gif-tap-hint {
  margin-top: 9px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-secondary);
  background: var(--chip-bg);
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--chip-border);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Bento Grid GIF Gallery (For payal5295 code) */
#gifGalleryContainer {
  text-align: center;
  margin: 72px auto 30px;
  max-width: 1160px;
  background: var(--glass-bg);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 34px;
  padding: 24px;
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
  position: relative;
  z-index: 2;
}

#gifGalleryContainer img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: var(--chip-bg);
  padding: 10px;
  border-radius: 22px;
  border: 1px solid var(--chip-border);

#gifGalleryContainer img:hover {

@media (max-width: 768px) {

  #gifGalleryContainer img { height: 135px; }
}
</style>

<body>

<!-- Full GIF Gallery Grid -->
<div id="gifGalleryContainer"></div>

<script>
// Create ambient floating hearts
for (let i = 0; i < 14; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.style.left = (Math.random() * 96 + 2) + "vw";
  heart.style.animationDuration = (9 + Math.random() * 8) + "s";
  heart.style.animationDelay = (-Math.random() * 14) + "s";
  const size = 10 + Math.random() * 8;
  heart.style.width = size + "px";
  heart.style.height = size + "px";
  document.body.appendChild(heart);
}

// Apple Dynamic Island Notification Controller
let islandTimer = null;
function showIsland(message, duration = 2200) {
  const island = document.getElementById("dynamicIsland");
  const textEl = document.getElementById("islandText");
  if (!island || !textEl) return;
  textEl.innerText = message;
  island.classList.add("active");
  clearTimeout(islandTimer);
  islandTimer = setTimeout(() => {
    island.classList.remove("active");
  }, duration);
}

// Romantic Sparkle/Heart Burst on Tap
function spawnBurst(x, y) {
  if (!x || !y) return;
  const symbols = ["💖", "✨", "🌸", "💕", "💘", "🎀"];
  for (let i = 0; i < 7; i++) {
    const el = document.createElement("div");
    el.className = "sparkle-particle";
    el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = x + "px";
    el.style.top = y + "px";
    const angle = Math.random() * Math.PI * 2;
    const distance = 35 + Math.random() * 55;
    el.style.setProperty("--tx", Math.cos(angle) * distance + "px");
    el.style.setProperty("--ty", (Math.sin(angle) * distance - 20) + "px");
    el.style.setProperty("--rot", (Math.random() * 90 - 45) + "deg");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 850);
  }
}

function setText(message, evt) {
  const textarea = document.getElementById("text");
  textarea.value = message;
  textarea.style.transform = "scale(1.015)";
  setTimeout(() => textarea.style.transform = "", 180);

  document.querySelectorAll(".preset-buttons button").forEach(btn => btn.classList.remove("active-chip"));
  if (evt && evt.currentTarget) {
    evt.currentTarget.classList.add("active-chip");
    spawnBurst(evt.clientX, evt.clientY);
  }
  showIsland("🎵 Sound loaded!", 1600);
}

function clearText() {
  const textarea = document.getElementById("text");
  textarea.value = "";
  document.querySelectorAll(".preset-buttons button").forEach(btn => btn.classList.remove("active-chip"));
  textarea.focus();
}

function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', isDark);
  showIsland(isDark ? "🌙 Dark velvet mode" : "☀️ Rose quartz mode", 1600);
}

let gifs = [];
let lastGifIndex = -1;

async function loadGifs() {
  try {
    const response = await fetch('./gifs.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    gifs = (data.files || []).map(file => data.baseUrl + file);

    const gifGalleryContainer = document.getElementById("gifGalleryContainer");
    gifGalleryContainer.innerHTML = "";
    gifs.forEach((gif, index) => {
      const img = document.createElement("img");
      img.src = gif;
      img.loading = "lazy";
      img.alt = `Cute Gif ${index + 1}`;
      gifGalleryContainer.appendChild(img);
    });

    const gifElement = document.getElementById("randomGif");
    if (gifElement && !gifElement.getAttribute("src") && gifs.length > 0) {
      changeGif();
    }
  } catch (error) {
    console.error("Error loading gifs.json:", error);
  }
}

window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('darkToggle').checked = true;
  }
  loadGifs();

  document.getElementById("codeInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkSecret();
  });
  document.getElementById("secretMessageInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkSecretMessage();
  });
});

function changeGif(evt) {
  if (gifs.length === 0) return;
  const gifElement = document.getElementById("randomGif");
  gifElement.style.opacity = "0.25";
  gifElement.style.transform = "scale(0.88)";
  gifElement.style.filter = "blur(6px)";

  let nextIndex = Math.floor(Math.random() * gifs.length);
  if (gifs.length > 1 && nextIndex === lastGifIndex) {
    nextIndex = (nextIndex + 1) % gifs.length;
  }
  lastGifIndex = nextIndex;

  setTimeout(() => {
    gifElement.src = gifs[nextIndex];
    gifElement.style.opacity = "1";
    gifElement.style.transform = "scale(1)";
    gifElement.style.filter = "blur(0px)";
  }, 140);

  if (evt) {
    spawnBurst(evt.clientX, evt.clientY);
    showIsland("🐼 New cute mood!", 1400);
  }
}

async function sendToAlexa(evt) {
  if (evt) spawnBurst(evt.clientX, evt.clientY);
  const text = document.getElementById("text").value.trim();
  const status = document.getElementById("status");
  const btn = document.getElementById("sendToAlexaBtn");

  if (!text) {
    status.innerText = "🌸 Please enter a cute message first!";
    showIsland("🌸 Write a message first!", 2000);
    return;
  }

  status.innerText = "💌 Sending love to Alexa...";
  btn.disabled = true;
  btn.innerText = "🎙️ Whispering...";
  showIsland("💌 Sending whisper to Echo...", 2500);

  try {
    const response = await fetch("https://api-v2.voicemonkey.io/announcement", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "ceaf115ac415b9674a43dfb33322e2ef_df91f7d5637439e6586689aa4caa93d1"
      },
      body: JSON.stringify({ device: "echo", text: text })
    });

    if (response.ok) {
      status.innerText = "💖 Alexa is whispering your sweet message!";
      showIsland("💖 Whisper delivered to Alexa!", 2800);
    } else {
      let errorMsg = "Something went wrong";
      try {
        const errorData = await response.json();
        if (errorData && errorData.error) errorMsg = errorData.error;
      } catch (_) {}
      status.innerText = "❌ Error: " + errorMsg;
      showIsland("❌ Could not send whisper", 2500);
    }
  } catch (error) {
    status.innerText = "❌ Network Error: Unable to reach VoiceMonkey.";
    showIsland("❌ Network connection error", 2500);
    console.error("Error in sendToAlexa:", error);
  } finally {
    btn.disabled = false;
    btn.innerText = "✨ Whisper to Alexa";
  }
}

let currentCode = '';

function triggerShake(cardId) {
  const card = document.getElementById(cardId);
  if (!card) return;
  card.classList.remove("shake");
  void card.offsetWidth;
  card.classList.add("shake");
}

function checkSecret() {
  const input = document.getElementById("codeInput").value.trim().toLowerCase();
  const validCodes = ["booboo", "payal5295", "baby"];
  const overlay = document.getElementById("codeOverlay");
  const error = document.getElementById("codeError");
  const randomGifContainer = document.getElementById("randomGifContainer");
  const gifGalleryContainer = document.getElementById("gifGalleryContainer");
  const birthdayCountdownContainer = document.getElementById("birthdayCountdownContainer");
  const anniversaryCountdownContainer = document.getElementById("anniversaryCountdownContainer");
  const birthdayContainer = document.getElementById("birthdayContainer");
  const anniversaryContainer = document.getElementById("anniversaryContainer");
  const container = document.querySelector(".container");
  const backArrow = document.querySelector(".back-arrow");
  const switchContainer = document.querySelector(".switch-container");
  const presetButtons = document.querySelectorAll(".preset-buttons button, .preset-buttons a");
  const secretMessageBtn = document.getElementById("secretMessageBtn");
  const sendToAlexaBtn = document.getElementById("sendToAlexaBtn");
  const textarea = document.getElementById("text");

  if (validCodes.includes(input)) {
    error.style.display = "none";
    overlay.style.opacity = "0";
    overlay.style.transform = "scale(1.04)";
    setTimeout(() => overlay.style.display = "none", 380);
    currentCode = input;
    showIsland("🔓 Unlocked with love 💖", 2400);

    if (input === "payal5295") {
      presetButtons.forEach(btn => btn.style.display = "none");
      gifGalleryContainer.style.display = "grid";
      randomGifContainer.style.display = "none";
      container.style.display = "none";
      backArrow.style.display = "none";
      switchContainer.style.display = "none";
      birthdayCountdownContainer.style.display = "none";
      anniversaryCountdownContainer.style.display = "none";
      birthdayContainer.style.display = "none";
      anniversaryContainer.style.display = "none";
      sendToAlexaBtn.style.display = "none";
      textarea.value = "";
    } else if (input === "booboo" || input === "baby") {
      presetButtons.forEach(btn => btn.style.display = (input === "booboo") ? "inline-flex" : "none");
      gifGalleryContainer.style.display = "none";
      randomGifContainer.style.display = "block";
      changeGif();
      container.style.display = "block";
      backArrow.style.display = "flex";
      switchContainer.style.display = "block";
      secretMessageBtn.style.display = "inline-flex";
      sendToAlexaBtn.style.display = (input === "booboo") ? "block" : "none";
      textarea.value = (input === "baby") ? "Good Morning!! It's OVER NOW...All the best for your life..." : "";
      displaySpecialEvents();
    }
  } else {
    error.style.display = "block";
    triggerShake("mainLockCard");
  }
}

function showSecretMessageOverlay() {
  document.getElementById("secretMessageOverlay").style.display = "flex";
  document.getElementById("secretMessageDisplay").style.display = "none";
  document.getElementById("secretMessageError").style.display = "none";
  document.getElementById("secretMessageInput").value = "";
}

function checkSecretMessage() {
  const input = document.getElementById("secretMessageInput").value.trim().toLowerCase();
  const secretMessageDisplay = document.getElementById("secretMessageDisplay");
  const secretMessageError = document.getElementById("secretMessageError");

  if (input === "booboo") {
    secretMessageDisplay.innerText = "app SMARTeefi email zrnhl@proton.me password Zarna@2006 ";
    secretMessageDisplay.style.display = "block";
    secretMessageError.style.display = "none";
    showIsland("🔐 Secret note unlocked!", 2200);
  } else {
    secretMessageError.style.display = "block";
    secretMessageDisplay.style.display = "none";
    triggerShake("secretVaultCard");
  }
}

async function displaySpecialEvents() {
  try {
    const birthdayCountdownContainer = document.getElementById("birthdayCountdownContainer");
    const birthdayCountdownMessage = document.getElementById("birthdayCountdownMessage");
    const anniversaryCountdownContainer = document.getElementById("anniversaryCountdownContainer");
    const anniversaryCountdownMessage = document.getElementById("anniversaryCountdownMessage");
    const birthdayContainer = document.getElementById("birthdayContainer");
    const birthdayImage = document.getElementById("birthdayImage");
    const birthdayVideo = document.getElementById("birthdayVideo");
    const birthdayAudio = document.getElementById("birthdayAudio");
    const birthdayMessage = document.getElementById("birthdayMessage");
    const anniversaryContainer = document.getElementById("anniversaryContainer");
    const anniversaryImage = document.getElementById("anniversaryImage");
    const anniversaryMessage = document.getElementById("anniversaryMessage");

    birthdayCountdownContainer.style.display = "none";
    anniversaryCountdownContainer.style.display = "none";
    birthdayContainer.style.display = "none";
    anniversaryContainer.style.display = "none";

    // Strictly show events & countdowns only when unlocked with "booboo"
    if (currentCode !== "booboo") return;

    const response = await fetch('./events.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const events = await response.json();

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const currentYear = today.getFullYear();

    const birthday = new Date(currentYear, events.birthday.month - 1, events.birthday.day);
    if (today > birthday) {
      birthday.setFullYear(currentYear + 1);
    }

    const anniversary = new Date(currentYear, events.anniversary.month - 1, events.anniversary.day);
    if (today > anniversary) {
      anniversary.setFullYear(currentYear + 1);
    }

    const emojis = ["😊", "🎉", "💖", "🐻", "🌸", "🍦", "🍧", "🍨", "🍩", "🍪", "🧁", "🥧", "🍫", "🍮", "🍾", "🥂", "🧋", "🌹", "🌷", "🎀", "👑", "💘", "💞", "🍀"];
    const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

    const daysUntilBirthday = Math.round((birthday - today) / (1000 * 60 * 60 * 24));
    const daysUntilAnniversary = Math.round((anniversary - today) / (1000 * 60 * 60 * 24));

    if (daysUntilBirthday === 0) {
      const content = (events.birthday.content || []).find(c => c.year === currentYear) || events.birthday.defaultContent;
      birthdayContainer.style.display = "block";
      if (content.image) {
        birthdayImage.src = content.image;
        birthdayImage.style.display = "block";
      } else {
        birthdayImage.removeAttribute("src");
        birthdayImage.style.display = "none";
      }
      if (content.video) {
        birthdayVideo.src = content.video;
        birthdayVideo.style.display = "block";
      } else {
        birthdayVideo.removeAttribute("src");
        birthdayVideo.style.display = "none";
      }
      if (content.audio) {
        birthdayAudio.src = content.audio;
        birthdayAudio.style.display = "block";
      } else {
        birthdayAudio.removeAttribute("src");
        birthdayAudio.style.display = "none";
      }
      birthdayMessage.innerText = content.message || "";
    } else if (daysUntilBirthday > 0 && daysUntilBirthday <= events.birthday.countdownDays) {
      birthdayCountdownContainer.style.display = "block";
      birthdayCountdownMessage.innerText = `🎂 Birthday in ${daysUntilBirthday} day${daysUntilBirthday === 1 ? '' : 's'}! ${randomEmoji}`;
    }

    if (daysUntilAnniversary === 0) {
      const content = (events.anniversary.content || []).find(c => c.year === currentYear) || events.anniversary.defaultContent;
      anniversaryContainer.style.display = "block";
      if (content.image) {
        anniversaryImage.src = content.image;
        anniversaryImage.style.display = "block";
      } else {
        anniversaryImage.removeAttribute("src");
        anniversaryImage.style.display = "none";
      }
      anniversaryMessage.innerText = content.message || "";
    } else if (daysUntilAnniversary > 0 && daysUntilAnniversary <= events.anniversary.countdownDays) {
      anniversaryCountdownContainer.style.display = "block";
      anniversaryCountdownMessage.innerText = `💞 ${daysUntilAnniversary} day${daysUntilAnniversary === 1 ? '' : 's'} left to our anniversary! ${randomEmoji}`;
    }
  } catch (error) {
    console.error("Error loading events.json:", error);
  }
}
</script>
