<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>💖 Alexa Cute Whisper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #fff6f9;
  --orb-1: #ff9ebb;
  --orb-2: #ffc2d4;
  --orb-3: #d0bfff;
  --orb-4: #ffd8be;
  --glass-bg: rgba(255, 255, 255, 0.75);
  --glass-bg-strong: rgba(255, 255, 255, 0.9);
  --glass-border: rgba(255, 255, 255, 0.9);
  --glass-inner-glow: inset 0 1px 1px rgba(255, 255, 255, 0.95);
  --glass-shadow: 0 20px 50px rgba(255, 77, 128, 0.12), 0 4px 12px rgba(0, 0, 0, 0.03);
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --accent: #ff2d55;
  --accent-gradient: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 55%, #ff85a1 100%);
  --accent-glow: rgba(255, 45, 85, 0.28);
  
  --unlock-gradient: linear-gradient(135deg, #5856D6 0%, #8583F2 100%);
  --unlock-glow: rgba(88, 86, 214, 0.35);

  --chip-bg: rgba(255, 255, 255, 0.82);
  --chip-hover: rgba(255, 45, 85, 0.1);
  --chip-border: rgba(255, 122, 162, 0.2);
  --input-bg: rgba(255, 255, 255, 0.92);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --smooth: cubic-bezier(0.22, 1, 0.36, 1);
}

.dark {
  --bg-base: #09080d;
  --orb-1: #590d22;
  --orb-2: #3c096c;
  --orb-3: #800f2f;
  --orb-4: #240046;
  --glass-bg: rgba(26, 23, 33, 0.72);
  --glass-bg-strong: rgba(32, 28, 42, 0.9);
  --glass-border: rgba(255, 255, 255, 0.12);
  --glass-inner-glow: inset 0 1px 1px rgba(255, 255, 255, 0.15);
  --glass-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 45, 85, 0.1);
  --text-primary: #f5f5f7;
  --text-secondary: #a1a1a6;
  --accent: #ff375f;
  --accent-gradient: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 50%, #c77dff 100%);
  --accent-glow: rgba(255, 55, 95, 0.4);
  
  --unlock-gradient: linear-gradient(135deg, #5E5CE6 0%, #AD46FF 100%);
  --unlock-glow: rgba(94, 92, 230, 0.4);

  --chip-bg: rgba(255, 255, 255, 0.08);
  --chip-hover: rgba(255, 55, 95, 0.2);
  --chip-border: rgba(255, 255, 255, 0.1);
  --input-bg: rgba(14, 12, 18, 0.8);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding: 10px;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
  background-color: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  transition: background-color 0.6s var(--smooth), color 0.4s var(--smooth);
}

/* Living Aurora Background */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.55;
  animation: drift 20s infinite alternate ease-in-out;
}

.orb-1 { width: 380px; height: 380px; background: var(--orb-1); top: -10%; left: -10%; }
.orb-2 { width: 340px; height: 340px; background: var(--orb-2); bottom: -10%; right: -8%; animation-delay: -5s; }
.orb-3 { width: 300px; height: 300px; background: var(--orb-3); top: 30%; left: 55%; animation-delay: -9s; }
.orb-4 { width: 260px; height: 260px; background: var(--orb-4); bottom: 15%; left: 5%; animation-delay: -3s; }

@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(40px, -30px) scale(1.1); }
  100% { transform: translate(-30px, 35px) scale(0.95); }
}

/* Floating Ambient Hearts */
.heart {
  position: fixed;
  bottom: -30px;
  width: 12px;
  height: 12px;
  background: var(--accent-gradient);
  transform: rotate(45deg);
  animation: floatUp linear infinite;
  z-index: 1;
  pointer-events: none;
  filter: drop-shadow(0 0 6px var(--accent-glow));
}

.heart::before, .heart::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: inherit;
  border-radius: 50%;
}
.heart::before { top: -50%; left: 0; }
.heart::after { left: -50%; top: 0; }

@keyframes floatUp {
  0% { transform: translateY(0) rotate(45deg) scale(0.5); opacity: 0; }
  15% { opacity: 0.4; }
  85% { opacity: 0.3; }
  100% { transform: translateY(-108vh) rotate(90deg) scale(1); opacity: 0; }
}

/* Sparkle Particle Burst */
.sparkle-particle {
  position: fixed;
  pointer-events: none;
  z-index: 99999;
  font-size: 15px;
  user-select: none;
  animation: particleFly 0.75s var(--smooth) forwards;
}

@keyframes particleFly {
  0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.15) rotate(var(--rot)); opacity: 0; }
}

/* Top Navigation */
.back-arrow {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), 0 4px 14px rgba(0, 0, 0, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: transform 0.3s var(--spring), background 0.25s ease;
  z-index: 10001;
}

.back-arrow:hover { transform: scale(1.08); background: var(--accent); }
.back-arrow svg { width: 16px; height: 16px; fill: var(--text-primary); transition: fill 0.25s; }
.back-arrow:hover svg { fill: #fff; }

.switch-container {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10000;
}

.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 28px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  box-shadow: var(--glass-inner-glow), 0 4px 14px rgba(0, 0, 0, 0.06);
  transition: 0.35s var(--smooth);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5px;
  font-size: 11px;
}

.slider::after { content: "☀️"; margin-left: auto; }
input:checked + .slider::after { content: "🌙"; margin-left: 0; margin-right: auto; }

.slider:before {
  position: absolute;
  content: "";
  height: 20px;
  width: 20px;
  left: 3px;
  bottom: 3px;
  background: var(--accent-gradient);
  border-radius: 50%;
  box-shadow: 0 2px 6px var(--accent-glow);
  transition: transform 0.35s var(--spring);
  z-index: 2;
}

input:checked + .slider:before { transform: translateX(22px); }

/* Minimalist Secret Code Overlay */
#codeOverlay, #secretMessageOverlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 244, 248, 0.6);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  padding: 16px;
}

.dark #codeOverlay, .dark #secretMessageOverlay {
  background: rgba(9, 8, 13, 0.75);
}

.lock-card {
  background: var(--glass-bg-strong);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  border-radius: 20px;
  padding: 22px 18px 18px;
  width: 100%;
  max-width: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: cardPopIn 0.4s var(--spring);
}

.lock-card h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

@keyframes cardPopIn {
  0% { opacity: 0; transform: scale(0.94) translateY(8px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

#codeOverlay input, #secretMessageOverlay input {
  width: 100%;
  padding: 9px 12px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid var(--chip-border);
  background: var(--input-bg);
  color: var(--text-primary);
  text-align: center;
  margin-bottom: 10px;
  outline: none;
  transition: all 0.2s var(--smooth);
}

#codeOverlay input:focus, #secretMessageOverlay input:focus {
  border-color: #5856D6;
  box-shadow: 0 0 0 3px var(--unlock-glow);
}

.unlock-btn {
  padding: 8px 20px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 999px;
  width: 100%;
  background: var(--unlock-gradient) !important;
  color: white !important;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 16px var(--unlock-glow);
  transition: transform 0.25s var(--spring), filter 0.2s ease;
}

.unlock-btn:hover {
  transform: translateY(-1px) scale(1.01);
  filter: brightness(1.08);
}

.unlock-btn:active {
  transform: scale(0.96);
}

.shake { animation: appleShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
@keyframes appleShake {
  10%, 90% { transform: translateX(-3px); }
  20%, 80% { transform: translateX(6px); }
  30%, 50%, 70% { transform: translateX(-8px); }
  40%, 60% { transform: translateX(8px); }
}

#codeError, #secretMessageError {
  color: #ff3b30;
  margin-top: 8px;
  display: none;
  font-size: 11.5px;
  font-weight: 600;
}

#secretMessageDisplay {
  display: none;
  margin-top: 10px;
  padding: 8px;
  border-radius: 10px;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  font-size: 12.5px;
  color: #5856D6;
  font-weight: 600;
  word-break: break-word;
}

/* Main Container */
.container {
  background: var(--glass-bg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-radius: 24px;
  padding: 14px 14px;
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  text-align: center;
  max-width: 480px;
  margin: 48px auto 10px;
  z-index: 2;
  position: relative;
  display: none;
  animation: cardPopIn 0.5s var(--spring);
}

.booboo-title {
  font-size: 14px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
  display: none;
}

.textarea-wrapper {
  position: relative;
  margin: 4px 0 8px;
}

textarea {
  width: 100%;
  height: 65px;
  padding: 10px 32px 10px 12px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 500;
  color: var(--text-primary);
  border: 1px solid var(--chip-border);
  border-radius: 14px;
  background: var(--input-bg);
  resize: none;
  outline: none;
  transition: all 0.2s var(--smooth);
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.clear-text-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  padding: 0;
  background: rgba(142, 142, 147, 0.2);
  color: var(--text-secondary);
  border: none;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0.7;
  transition: all 0.2s;
}

.clear-text-btn:hover { background: var(--accent); color: #fff; opacity: 1; transform: scale(1.1); }

.preset-buttons {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin: 6px 0 10px;
}

.preset-buttons button, .preset-buttons a {
  margin-top: 0;
  background: var(--chip-bg);
  color: var(--text-primary);
  padding: 6px 4px;
  border: 1px solid var(--chip-border);
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--glass-inner-glow);
  transition: transform 0.2s var(--spring), background 0.2s ease, color 0.2s ease;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.preset-buttons button:hover,
.preset-buttons button.active-chip,
.preset-buttons a:hover {
  background: var(--accent-gradient);
  color: #fff;
  border-color: transparent;
  transform: translateY(-1px) scale(1.02);
  box-shadow: 0 4px 12px var(--accent-glow);
}

button {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  background: var(--accent-gradient);
  color: white;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 16px var(--accent-glow);
  transition: transform 0.25s var(--spring), filter 0.2s ease;
}

button:hover { transform: translateY(-1px) scale(1.01); filter: brightness(1.05); }
button:active { transform: scale(0.96); }

#sendToAlexaBtn {
  width: 100%;
  max-width: 240px;
  margin: 2px auto 0;
  padding: 9px 20px;
}

#status {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  min-height: 16px;
}

.widgets-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 6px;
  margin-top: 8px;
}

#birthdayCountdownContainer, #anniversaryCountdownContainer {
  display: none;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 12px;
  padding: 8px;
  text-align: center;
}

#birthdayCountdownMessage, #anniversaryCountdownMessage, #birthdayMessage, #anniversaryMessage {
  font-size: 12.5px;
  color: var(--accent);
  font-weight: 700;
}

#birthdayContainer, #anniversaryContainer {
  text-align: center;
  margin-top: 10px;
  padding: 10px;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 14px;
  display: none;
}

#birthdayImage, #anniversaryImage, #birthdayVideo {
  max-width: 100%;
  max-height: 180px;
  height: auto;
  margin: 4px auto;
  display: none;
  border-radius: 10px;
  object-fit: cover;
}

#birthdayAudio, #anniversaryAudio {
  margin: 6px auto;
  width: 100%;
  max-width: 220px;
  display: none;
}

/* Larger Random GIF Frame without Text */
#randomGifContainer {
  text-align: center;
  margin: 14px auto 18px;
  display: none;
  position: relative;
  z-index: 2;
  width: fit-content;
}

.gif-glass-frame {
  background: var(--glass-bg);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-inner-glow), var(--glass-shadow);
  padding: 12px;
  border-radius: 24px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.25s var(--spring);
}

.gif-glass-frame:hover { transform: translateY(-3px) scale(1.02); }

#randomGif {
  width: 175px;
  height: 175px;
  border-radius: 16px;
  object-fit: contain;
  transition: opacity 0.2s ease, filter 0.2s ease;
}

/* GIF Gallery */
#gifGalleryContainer {
  text-align: center;
  margin: 40px auto 14px;
  max-width: 900px;
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 12px;
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  position: relative;
  z-index: 2;
}

#gifGalleryContainer img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  background: var(--chip-bg);
  padding: 4px;
  border-radius: 12px;
  border: 1px solid var(--chip-border);
  transition: transform 0.2s var(--spring);
}
#gifGalleryContainer img:hover { transform: scale(1.03); }
</style>
</head>

for (let i = 0; i < 10; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.style.left = (Math.random() * 96 + 2) + "vw";
  heart.style.animationDuration = (8 + Math.random() * 6) + "s";
  heart.style.animationDelay = (-Math.random() * 10) + "s";
  const size = 8 + Math.random() * 5;
  heart.style.width = size + "px";
  heart.style.height = size + "px";
  document.body.appendChild(heart);
}

function spawnBurst(x, y) {
  if (!x || !y) return;
  const symbols = ["💖", "✨", "🌸", "💕"];
  for (let i = 0; i < 4; i++) {
    const el = document.createElement("div");
    el.className = "sparkle-particle";
    el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = x + "px";
    el.style.top = y + "px";
    const angle = Math.random() * Math.PI * 2;
    const distance = 25 + Math.random() * 35;
    el.style.setProperty("--tx", Math.cos(angle) * distance + "px");
    el.style.setProperty("--ty", (Math.sin(angle) * distance - 12) + "px");
    el.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
}

function setText(message, evt) {
  const textarea = document.getElementById("text");
  textarea.value = message;
  document.querySelectorAll(".preset-buttons button").forEach(btn => btn.classList.remove("active-chip"));
  if (evt && evt.currentTarget) {
    evt.currentTarget.classList.add("active-chip");
    spawnBurst(evt.clientX, evt.clientY);
  }
}

function clearText() {
  const textarea = document.getElementById("text");
  textarea.value = "";
  document.querySelectorAll(".preset-buttons button").forEach(btn => btn.classList.remove("active-chip"));
  textarea.focus();
}

function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', isDark);
}

let gifs = [];
let lastGifIndex = -1;

async function loadGifs() {
  try {
    const response = await fetch('./gifs.json');
    if (!response.ok) throw new Error();
    const data = await response.json();
    gifs = (data.files || []).map(file => data.baseUrl + file);

    const gifGalleryContainer = document.getElementById("gifGalleryContainer");
    gifGalleryContainer.innerHTML = "";
    gifs.forEach((gif) => {
      const img = document.createElement("img");
      img.src = gif;
      img.loading = "lazy";
      gifGalleryContainer.appendChild(img);
    });

    const gifElement = document.getElementById("randomGif");
    if (gifElement && !gifElement.getAttribute("src") && gifs.length > 0) {
      changeGif();
    }
  } catch (error) {}
}

window.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.getElementById('darkToggle').checked = true;
  }
  loadGifs();

  document.getElementById("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkSecret(); });
  document.getElementById("secretMessageInput").addEventListener("keydown", (e) => { if (e.key === "Enter") checkSecretMessage(); });
});

function changeGif(evt) {
  if (gifs.length === 0) return;
  const gifElement = document.getElementById("randomGif");
  gifElement.style.opacity = "0.2";

  let nextIndex = Math.floor(Math.random() * gifs.length);
  if (gifs.length > 1 && nextIndex === lastGifIndex) nextIndex = (nextIndex + 1) % gifs.length;
  lastGifIndex = nextIndex;

  setTimeout(() => {
    gifElement.src = gifs[nextIndex];
    gifElement.style.opacity = "1";
  }, 100);

  if (evt) {
    spawnBurst(evt.clientX, evt.clientY);
  }
}

async function sendToAlexa(evt) {

async function displaySpecialEvents() {
  try {
    if (currentCode !== "booboo") return;
    const response = await fetch('./events.json');
    if (!response.ok) return;
    const events = await response.json();

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const currentYear = today.getFullYear();

    const birthday = new Date(currentYear, events.birthday.month - 1, events.birthday.day);
    if (today > birthday) birthday.setFullYear(currentYear + 1);

    const anniversary = new Date(currentYear, events.anniversary.month - 1, events.anniversary.day);
    if (today > anniversary) anniversary.setFullYear(currentYear + 1);

    const emojis = ["😊", "🎉", "💖", "🐻", "🌸", "🧁", "🌹", "🎀", "💘", "💞"];
    const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];

    const daysUntilBirthday = Math.round((birthday - today) / (1000 * 60 * 60 * 24));
    const daysUntilAnniversary = Math.round((anniversary - today) / (1000 * 60 * 60 * 24));

    if (daysUntilBirthday === 0) {
      const content = (events.birthday.content || []).find(c => c.year === currentYear) || events.birthday.defaultContent;
      document.getElementById("birthdayContainer").style.display = "block";
      if (content.image) { document.getElementById("birthdayImage").src = content.image; document.getElementById("birthdayImage").style.display = "block"; }
      if (content.video) { document.getElementById("birthdayVideo").src = content.video; document.getElementById("birthdayVideo").style.display = "block"; }
      if (content.audio) { document.getElementById("birthdayAudio").src = content.audio; document.getElementById("birthdayAudio").style.display = "block"; }
      document.getElementById("birthdayMessage").innerText = content.message || "";
    } else if (daysUntilBirthday > 0 && daysUntilBirthday <= events.birthday.countdownDays) {
      document.getElementById("birthdayCountdownContainer").style.display = "block";
      document.getElementById("birthdayCountdownMessage").innerText = `🎂 Birthday in ${daysUntilBirthday} day${daysUntilBirthday === 1 ? '' : 's'}! ${randomEmoji}`;
    }

    if (daysUntilAnniversary === 0) {
      const content = (events.anniversary.content || []).find(c => c.year === currentYear) || events.anniversary.defaultContent;
      document.getElementById("anniversaryContainer").style.display = "block";
      if (content.image) { document.getElementById("anniversaryImage").src = content.image; document.getElementById("anniversaryImage").style.display = "block"; }
      document.getElementById("anniversaryMessage").innerText = content.message || "";
    } else if (daysUntilAnniversary > 0 && daysUntilAnniversary <= events.anniversary.countdownDays) {
      document.getElementById("anniversaryCountdownContainer").style.display = "block";
      document.getElementById("anniversaryCountdownMessage").innerText = `💞 ${daysUntilAnniversary} day${daysUntilAnniversary === 1 ? '' : 's'} to anniversary! ${randomEmoji}`;
    }
  } catch (error) {}
}
