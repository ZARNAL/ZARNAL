<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteVibe: Glass Snaps</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Manrope', sans-serif;
      background: linear-gradient(135deg, #f0f2f5 0%, #e0e4ea 100%);
      color: #1c2526;
      overflow-x: hidden;
    }
    .content-wrapper {
      display: flex; flex-direction: column;
      min-height: 100vh; padding: 24px;
      align-items: center; position: relative;
      overflow: hidden;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 680px; margin-bottom: 24px; padding: 0 8px;
    }
    h1 {
      font-size: 2.6rem; font-weight: 800; color: #1c2526; text-align: center;
      flex-grow: 1; letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.05);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-12px);} to {opacity: 1; transform: translateY(0);} }
    .back-btn { color: #007aff; text-decoration: none; font-size: 1.1rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .back-btn:hover { color: #005bb5; transform: translateX(-2px); }
    .title-bar {
      width: 100%; max-width: 680px; display: flex; flex-direction: column;
      gap: 12px; margin-bottom: 24px;
    }
    .title-btn {
      flex: 1; padding: 14px 18px; border: none; border-radius: 14px;
      background: rgba(255,255,255,0.25); backdrop-filter: blur(12px);
      font-size: 1.1rem; font-weight: 600; color: #1c2526;
      cursor: pointer; transition: all 0.3s ease; width: 100%; position: relative;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .title-btn:hover { transform: scale(1.05); background: rgba(255,255,255,0.35);
      box-shadow: 0 6px 18px rgba(0,122,255,0.3);
    }
    .title-btn.active { background: rgba(0,122,255,0.3); color: #007aff; }
    .back-btn-action {
      padding: 14px 28px; border: none; border-radius: 14px;
      background: rgba(255,255,255,0.25); backdrop-filter: blur(12px);
      font-size: 1.1rem; font-weight: 600; color: #007aff; cursor: pointer;
      transition: all 0.3s ease; animation: pulse 2s infinite ease-in-out;
      margin-bottom: 24px;
    }
    .back-btn-action:hover { background: rgba(0,122,255,0.3); color: #005bb5; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,122,255,0.4);}
      50% { box-shadow: 0 0 0 10px rgba(0,122,255,0);}
      100% { box-shadow: 0 0 0 0 rgba(0,122,255,0.4);}
    }
    .search-bar { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .search-bar input {
      padding: 16px 20px; border: none; border-radius: 14px;
      background: rgba(255,255,255,0.2); backdrop-filter: blur(12px);
      font-size: 1.1rem; color: #1c2526; outline: none;
    }
    .search-bar input:focus { background: rgba(255,255,255,0.3); box-shadow: 0 4px 14px rgba(0,122,255,0.3); }
    .search-bar button {
      padding: 16px 28px; border: none; border-radius: 14px;
      background: rgba(0,122,255,0.25); backdrop-filter: blur(12px);
      font-size: 1.1rem; font-weight: 600; color: #007aff; cursor: pointer;
      transition: all 0.3s ease;
    }
    .search-bar button:hover { background: rgba(0,122,255,0.35); color: #005bb5; transform: scale(1.05);}
    .category-title {
      width: 100%; max-width: 680px; font-size: 2rem; font-weight: 700;
      color: #007aff; text-align: center; margin-bottom: 20px;
    }
    #quotes { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 680px; }
    .quote-card {
      background: rgba(255,255,255,0.2); backdrop-filter: blur(12px);
      border-radius: 16px; padding: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.1);
      display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;
    }
    .quote-card:hover { transform: scale(1.02); box-shadow: 0 6px 18px rgba(0,122,255,0.3);}
    .quote-card p { font-size: 1rem; font-weight: 500; color: #1c2526; text-align: center; line-height: 1.6; max-width: 90%;}
    .actions { position: absolute; bottom: 12px; right: 12px; display: flex; gap: 16px;}
    .action-btn { background: transparent; border: none; color: #5e6b6d; cursor: pointer; }
    .action-btn:hover { color: #007aff; }
    .action-btn .material-icons-outlined { font-size: 26px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,122,255,0.25); backdrop-filter: blur(12px);
      color: #1c2526; padding: 12px 24px; border-radius: 14px;
      font-size: 1.1rem; font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,122,255,0.3);
      animation: popIn 0.3s ease, popOut 0.3s ease 1.5s forwards;
    }
    @keyframes popIn { from {opacity:0; transform:translateX(-50%) scale(0.8);} to {opacity:1; transform:translateX(-50%) scale(1);} }
    @keyframes popOut { from {opacity:1;} to {opacity:0;} }
    @media (max-width: 500px) {
      h1 { font-size: 2.2rem; }
      .quote-card p { font-size: 1.2rem; }
      .category-title { font-size: 1.8rem; }
    }
  </style>


  <div class="content-wrapper">
    <div class="header">
      <a href="https://zarnalhome.odoo.com/" class="back-btn" aria-label="Go back">
        <span class="material-icons-outlined">arrow_back</span>
      </a>
      <h1>InstaQuotes</h1>
    </div>
    <div class="title-bar" id="title-bar"></div>
    <div class="search-bar" id="search-bar" style="display:none;">
      <input type="text" id="search" placeholder="Search quotes...">
      <button id="toggle-favorites">My Snaps</button>
      <button class="back-btn-action" id="back-to-titles">Back</button>
    </div>
    <div id="category-title" class="category-title" style="display:none;"></div>
    <div id="quotes"></div>
  </div>

  <script>
    let quotesData = {};
    let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
    let showFavorites = false;
    let selectedTitle = null;
    let showTitles = true;

    const quotesContainer = document.getElementById('quotes');
    const searchInput = document.getElementById('search');
    const favoritesBtn = document.getElementById('toggle-favorites');
    const titleBar = document.getElementById('title-bar');
    const searchBar = document.getElementById('search-bar');
    const backToTitlesBtn = document.getElementById('back-to-titles');
    const categoryTitle = document.getElementById('category-title');

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 1800);
    }

    // Modern + fallback copy
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text)
          .then(() => true)
          .catch(() => fallbackCopyTextToClipboard(text));
      } else {
        return fallbackCopyTextToClipboard(text);
      }
    }
    function fallbackCopyTextToClipboard(text) {
      return new Promise((resolve, reject) => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
          const successful = document.execCommand('copy');
          document.body.removeChild(textarea);
          if (successful) resolve(true); else reject(false);
        } catch (err) {
          document.body.removeChild(textarea);
          reject(false);
        }
      });
    }

    function generateTitleButtons(titles) {
      titleBar.innerHTML = '';
      titles.forEach(title => {
        const btn = document.createElement('button');
        btn.className = 'title-btn';
        btn.textContent = title;
        btn.addEventListener('click', () => {
          selectedTitle = title; showTitles = false;
          titleBar.style.display = 'none';
          searchBar.style.display = 'flex';
          categoryTitle.style.display = 'block';
          categoryTitle.textContent = title;
          showToast(`Showing ${title} quotes`);
          renderQuotes();
        });
        titleBar.appendChild(btn);
      });
    }

    function renderQuotes() {
      quotesContainer.innerHTML = '';
      if (showTitles) {
        quotesContainer.innerHTML = `<p style="text-align:center;color:#5e6b6d">Select a category to view quotes.</p>`;
        categoryTitle.style.display = 'none';
        return;
      }
      let filteredQuotes = [];
      if (showFavorites) {
        filteredQuotes = quotesData[selectedTitle].filter(q => favorites.includes(q));
      } else {
        filteredQuotes = quotesData[selectedTitle].filter(q =>
          q && q.toLowerCase().includes(searchInput.value.toLowerCase())
        );
      }
      if (filteredQuotes.length === 0) {
        quotesContainer.innerHTML = `<p style="text-align:center;color:#5e6b6d">${showFavorites ? 'No favorite snaps.' : 'No quotes found.'}</p>`;
        return;
      }
      filteredQuotes.forEach(quote => {
        const card = document.createElement('div');
        card.className = 'quote-card';
        const fontSize = quote.length > 100 ? '1.2rem' : quote.length > 50 ? '1.25rem' : '1.3rem';
        card.innerHTML = `
          <p style="font-size:${fontSize}">${quote}</p>
          <div class="actions">
            <button class="action-btn favorite-btn" data-quote="${quote}">
              <span class="material-icons-outlined">${favorites.includes(quote) ? 'favorite' : 'favorite_border'}</span>
            </button>
            <button class="action-btn copy-btn" data-quote="${quote}">
              <span class="material-icons-outlined">content_copy</span>
            </button>
          </div>`;
        quotesContainer.appendChild(card);
      });
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const quote = btn.dataset.quote;
          if (favorites.includes(quote)) {
            favorites = favorites.filter(f => f !== quote);
            showToast('Removed from favorites');
          } else {
            favorites.push(quote);
            showToast('Added to favorites');
          }
          localStorage.setItem('favorites', JSON.stringify(favorites));
          renderQuotes();
        });
      });
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const quote = btn.dataset.quote;
          copyToClipboard(quote).then(() => {
            btn.innerHTML = '<span class="material-icons-outlined">check</span>';
            showToast('Quote copied!');
            setTimeout(() => btn.innerHTML = '<span class="material-icons-outlined">content_copy</span>', 1500);
          }).catch(() => showToast('Copy failed!'));
        });
      });
    }

    async function fetchQuotes() {
      try {
        const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQhw_i8N41XmZROkyUhHd1mPcx-OO42Zt0SyYbjmeA7f-8Khh1x4IpyN5M2AXQXl4PVmb8azGlxmJGO/pub?gid=61688139&single=true&output=csv');
        const data = await response.text();
        const rows = data.split('\n').map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
        const titles = rows[0].filter(t => t);
        quotesData = titles.reduce((a,t) => (a[t]=[],a),{});
        for (let i=1;i<rows.length;i++) {
          for (let j=0;j<titles.length;j++) {
            let q = rows[i][j];
            if (q) { q=q.replace(/"/g,'').trim(); if(q) quotesData[titles[j]].push(q); }
          }
        }
        generateTitleButtons(titles);
        renderQuotes();
      } catch (err) {
        quotesContainer.innerHTML = `<p style="text-align:center;color:#007aff">Failed to load quotes.</p>`;
      }
    }

    searchInput.addEventListener('input', renderQuotes);
    favoritesBtn.addEventListener('click', () => {
      showFavorites = !showFavorites;
      favoritesBtn.textContent = showFavorites ? 'All Snaps' : 'My Snaps';
      renderQuotes();
    });
    backToTitlesBtn.addEventListener('click', () => {
      showTitles = true; selectedTitle = null;
      titleBar.style.display = 'flex'; searchBar.style.display = 'none';
      categoryTitle.style.display = 'none';
      showToast('Back to categories');
      renderQuotes();
    });

    fetchQuotes();
  </script>
