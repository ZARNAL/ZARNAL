<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Coin Flip Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --background: linear-gradient(135deg, #ffe6f0 0%, #e6ccff 100%);
            --text-color: #4a2e4a;
            --coin-bg: #fff5f8;
            --coin-shadow: 0 4px 8px rgba(74, 46, 74, 0.2);
            --coin-hover-shadow: 0 8px 16px rgba(74, 46, 74, 0.3);
            --button-bg: linear-gradient(145deg, #ff99cc, #cc6699);
            --button-hover-bg: linear-gradient(145deg, #cc6699, #b34780);
            --button-shadow: 0 6px 12px rgba(74, 46, 74, 0.2);
            --button-hover-shadow: 0 8px 16px rgba(74, 46, 74, 0.3);
            --focus-ring: rgba(255, 153, 204, 0.3);
            --result-heads: #ff6699;
            --result-tails: #cc99ff;
            --minimal-bg: rgba(255, 153, 204, 0.2); /* Subtle pink for minimalist button */
            --minimal-hover-bg: rgba(255, 153, 204, 0.4);
        }

        [data-theme="dark"] {
            --background: linear-gradient(135deg, #4a2e4a 0%, #3b2e5c 100%);
            --text-color: #f0e6f0;
            --coin-bg: #5c3d5c;
            --coin-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            --coin-hover-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
            --button-bg: linear-gradient(145deg, #cc6699, #994d7a);
            --button-hover-bg: linear-gradient(145deg, #994d7a, #803d66);
            --button-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            --button-hover-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
            --focus-ring: rgba(204, 102, 153, 0.3);
            --result-heads: #ff99cc;
            --result-tails: #cc99ff;
            --minimal-bg: rgba(204, 102, 153, 0.2); /* Subtle dark pink for dark mode */
            --minimal-hover-bg: rgba(204, 102, 153, 0.4);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--background);
            font-family: 'Georgia', 'Times New Roman', serif;
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: -1;
            filter: blur(50px);
        }

        .coin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .coin {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--coin-bg);
            box-shadow: var(--coin-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.6s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .coin:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 30%, rgba(74, 46, 74, 0.1) 100%);
            top: 0;
            left: 0;
            z-index: 1;
            opacity: 0.5;
        }

        .coin:hover {
            transform: scale(1.05);
            box-shadow: var(--coin-hover-shadow);
        }

        .coin i {
            font-size: 3.5rem;
            color: var(--text-color);
            z-index: 2;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .coin.flipping i {
            opacity: 0;
            transform: scale(1.2);
        }

        .coin.flipping {
            animation: flip 1.5s forwards;
        }

        @keyframes flip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(1800deg); }
            100% { transform: rotateY(3600deg); }
        }

        .result {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 20px;
            transition: color 0.3s ease, transform 0.3s ease;
            font-style: italic;
        }

        .result-heads {
            color: var(--result-heads);
        }

        .result-tails {
            color: var(--result-tails);
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            background: var(--button-bg);
            color: #ffffff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: var(--button-shadow);
            outline: none;
            margin: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        button:hover {
            background: var(--button-hover-bg);
            transform: scale(1.05);
            box-shadow: var(--button-hover-shadow);
        }

        button:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            box-shadow: none;
            font-size: 1.2rem;
        }

        .theme-toggle i {
            color: var(--text-color);
        }

        .theme-toggle:hover {
            background: none;
            transform: scale(1.1);
            box-shadow: none;
        }

        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px;
            font-size: 1rem;
            border: none;
            border-radius: 50%;
            background: var(--minimal-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            box-shadow: none;
        }

        .back-button:hover {
            background: var(--minimal-hover-bg);
            transform: scale(1.1);
        }

        .back-button:focus {
            box-shadow: 0 0 0 2px var(--focus-ring);
        }

        .back-button i {
            font-size: 1rem;
        }
    </style>


    <a href="https://zarnal.odoo.com/funcollector" class="back-button">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    <button class="theme-toggle" onclick="toggleTheme()">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
    </button>
    <div class="coin-container">
        <div class="coin" id="coin">
            <i id="coinIcon" class="fa-solid fa-question"></i>
        </div>
        <div class="result" id="result">Flip the coin, my love</div>
        <button onclick="flipCoin()">Flip Coin</button>
    </div>
    <script>
        function flipCoin() {
            const coin = document.getElementById('coin');
            const coinIcon = document.getElementById('coinIcon');
            const result = document.getElementById('result');

            coin.classList.add('flipping');

            setTimeout(() => {
                const isHeads = Math.random() < 0.5;
                const flipResult = isHeads ? 'Heads' : 'Tails';
                result.textContent = flipResult;
                result.className = `result ${isHeads ? 'result-heads' : 'result-tails'}`;
                coin.classList.remove('flipping');
                coinIcon.className = isHeads ? 'fa-solid fa-crown' : 'fa-solid fa-star';
                coinIcon.style.opacity = 1;
                coinIcon.style.transform = 'scale(1)';
            }, 1500);
        }

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const currentTheme = body.getAttribute('data-theme');

            if (currentTheme === 'dark') {
                body.removeAttribute('data-theme');
                themeIcon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
        });
    </script>
