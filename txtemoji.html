  <title>Text &amp; Emoji Haven 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-light: linear-gradient(135deg, #fff1f2 0%, #dbeafe 100%);
      --bg-gradient-dark: linear-gradient(135deg, #1e1e2e 0%, #3730a3 100%);
      --card-bg-light: rgba(255, 255, 255, 0.95);
      --card-bg-dark: rgba(30, 30, 46, 0.95);
      --text-color-light: #2f2f2f;
      --text-color-dark: #e5e5e5;
      --accent-color: #ec4899;
      --shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      --border-radius: 20px;
      --padding: 24px;
      --spacing: 16px;
    }

    html {
      min-height: 100%;
      height: auto;
    }

    body[data-theme="light"] {
      --bg-gradient: var(--bg-gradient-light);
      --card-bg: var(--card-bg-light);
      --text-color: var(--text-color-light);
    }

    body[data-theme="dark"] {
      --bg-gradient: var(--bg-gradient-dark);
      --card-bg: var(--card-bg-dark);
      --text-color: var(--text-color-dark);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Playfair Display', serif;
      background: var(--bg-gradient, linear-gradient(135deg, #fff1f2 0%, #dbeafe 100%));
      background-attachment: fixed;
      -webkit-background-attachment: fixed;
      background-size: 100% 100%;
      -webkit-background-size: 100% 100%;
      background-repeat: no-repeat;
      color: var(--text-color);
      min-height: 100%;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 92%;
      max-width: 800px;
      text-align: center;
      padding: calc(var(--padding) * 1.5) 0;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: calc(var(--padding) * 1.5);
      padding: 0 calc(var(--padding) / 2);
      position: relative;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent-color);
      margin: 0;
      font-weight: 500;
      letter-spacing: 1.2px;
      flex-grow: 1;
      text-align: center;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      font-size: 1rem;
      color: var(--accent-color);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      transition: opacity 0.3s ease, transform 0.2s ease;
      z-index: 10;
    }

    .back-button::before {
      content: '←';
      font-size: 1.2rem;
      margin-right: 6px;
      transition: transform 0.2s ease;
    }

    .back-button:hover, .back-button:active {
      opacity: 0.9;
      transform: scale(1.05);
    }

    .back-button:hover::before {
      transform: translateX(-3px);
    }

    .theme-switch {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 8px;
      border-radius: var(--border-radius);
      transition: background 0.3s ease, transform 0.2s ease;
      z-index: 10;
    }

    .theme-switch:hover, .theme-switch:active {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: var(--spacing);
      padding: var(--spacing);
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin: 0 calc(var(--padding) / 2);
    }

    .emoji-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 14px;
      border-radius: var(--border-radius);
      background: linear-gradient(145deg, rgba(255, 245, 250, 0.7), rgba(245, 235, 240, 0.7));
      min-height: 100px;
      transition: transform 0.3s ease, background 0.3s ease;
      position: relative;
      word-break: break-word;
    }

    body[data-theme="dark"] .emoji-card {
      background: linear-gradient(145deg, rgba(50, 50, 75, 0.7), rgba(40, 40, 65, 0.7));
    }

    .emoji-card:hover, .emoji-card:active {
      transform: translateY(-3px) scale(1.03);
      background: linear-gradient(145deg, rgba(255, 245, 250, 0.9), rgba(245, 235, 240, 0.9));
    }

    body[data-theme="dark"] .emoji-card:hover, body[data-theme="dark"] .emoji-card:active {
      background: linear-gradient(145deg, rgba(70, 70, 95, 0.9), rgba(60, 60, 85, 0.9));
    }

    .emoji {
      font-size: 1.5rem;
      line-height: 1.3;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .emoji-name {
      font-size: 0.75rem;
      color: #787878;
      padding: 0 6px;
      word-break: break-word;
    }

    body[data-theme="dark"] .emoji-name {
      color: #a3a3a3;
    }

    .copy-message {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: var(--accent-color);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 1000;
      box-shadow: var(--shadow);
    }

    .copy-message.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.8rem; }
      .emoji { font-size: 1.3rem; }
      .emoji-name { font-size: 0.7rem; }
      .emoji-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: calc(var(--spacing) / 1.2);
        margin: 0 calc(var(--padding) / 3);
      }
      .container {
        padding: var(--padding) 0;
      }
      .header {
        padding: 0 calc(var(--padding) / 3);
      }
      .back-button {
        font-size: 0.9rem;
        padding: 6px 10px;
      }
      .back-button::before {
        font-size: 1rem;
      }
      .theme-switch {
        font-size: 1.2rem;
        padding: 6px;
      }
      .emoji-card {
        padding: 12px;
        min-height: 90px;
      }
    }

    @media (max-width: 360px) {
      h1 { font-size: 1.6rem; }
      .emoji { font-size: 1.2rem; }
      .emoji-name { font-size: 0.65rem; }
      .emoji-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .back-button, .theme-switch {
        padding: 5px 8px;
      }
      .emoji-card {
        padding: 10px;
        min-height: 80px;
      }
    }
  </style>

    });

    function copyEmoji(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(showCopyMessage).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "absolute";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        const success = document.execCommand("copy");
        if (success) showCopyMessage();
        else alert("Copy failed. Please copy manually.");
      } catch {
        alert("Copy not supported. Please copy manually.");
      }
      document.body.removeChild(textarea);
    }

    function showCopyMessage() {
      copyMessage.classList.add("show");
      setTimeout(() => copyMessage.classList.remove("show"), 1500);
    }

    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute("data-theme") || "light";
      const newTheme = currentTheme === "light" ? "dark" : "light";
      body.setAttribute("data-theme", newTheme);
      themeSwitch.textContent = newTheme === "light" ? "🌙" : "☀️";
      body.style.display = 'none';
      body.offsetHeight;
      body.style.display = 'flex';
    }

    function goBack() {
      try {
        window.location.assign("https://zarnal.github.io/ZARNAL/zrnl.html");
      } catch (e) {
        alert("Unable to navigate back. The page may not exist or requires login. Please check the URL or try another page.");
        // Fallback to Odoo homepage as a default
        window.location.assign("https://www.odoo.com");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const body = document.body;
      let currentTheme = body.getAttribute("data-theme") || "light";
      body.setAttribute("data-theme", currentTheme);
      themeSwitch.textContent = currentTheme === "light" ? "🌙" : "☀️";
      body.style.display = 'none';
      body.offsetHeight;
      body.style.display = 'flex';
    });
  </script>
