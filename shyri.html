<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fa">
<title>Zarnal Shayri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff8fb;--surface:rgba(255,255,255,.78);--card:#fff;--text:#241c23;--muted:#867681;--line:rgba(120,70,100,.13);--accent:#df668e;--accent-soft:#fce9f0;--shadow:0 8px 26px rgba(74,33,55,.06);--radius:23px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 0%,#fff0f6 0,transparent 35%),var(--bg);transition:background .3s,color .3s}
body.dark{color-scheme:dark;--bg:#211923;--surface:rgba(48,37,49,.78);--card:#302532;--text:#f4eaf1;--muted:#b5a6b4;--line:rgba(255,255,255,.09);--accent:#e995b6;--accent-soft:rgba(233,149,182,.13);--shadow:0 9px 28px rgba(0,0,0,.18);background:radial-gradient(ellipse at 10% 0%,#39263a 0,transparent 40%),var(--bg)}
button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}
.wrap{max-width:1120px;margin:auto;padding:0 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.back{border:0;background:transparent;padding:9px 12px;border-radius:13px;text-decoration:none;color:var(--text);font-weight:600;cursor:pointer}.back:hover{background:var(--accent-soft)}.theme{border:1px solid var(--line);background:var(--surface);width:44px;height:44px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .2s}.theme:active{transform:scale(.93)}
.hero{text-align:center;padding:15px 0 23px}.hero-icon{font-size:42px;line-height:1.2}.hero h1{margin:10px 0 6px;font-size:clamp(24px,4vw,34px);letter-spacing:-.045em}.hero p{margin:0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:0 auto 22px}.search{flex:1;min-width:230px;max-width:540px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 15px;box-shadow:var(--shadow)}.search input{width:100%;background:transparent;border:0;outline:none;color:var(--text);font-size:15px}.search input::placeholder{color:var(--muted)}
.lang{display:flex;gap:4px;background:var(--accent-soft);border-radius:14px;padding:4px}.lang button{border:0;background:transparent;padding:9px 13px;border-radius:11px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:650;transition:background .2s,color .2s}.lang button.active{background:var(--card);color:var(--accent);box-shadow:0 2px 7px rgba(0,0,0,.06)}
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.category{appearance:none;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:var(--radius);padding:20px 12px;box-shadow:var(--shadow);cursor:pointer;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:transform .22s,box-shadow .22s,border-color .22s,background .22s;animation:rise .35s both}.category:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 13px 30px rgba(160,75,110,.1)}.category:active{transform:scale(.97)}.emoji{font-size:34px;line-height:1}.cat-name{font-size:14px;font-weight:650}.count{font-size:12px;color:var(--muted)}
.view{display:none;animation:rise .28s both}.view.show{display:block}.cat-top{display:flex;align-items:center;gap:12px;margin:0 0 18px}.cat-top .back{padding-left:0}.cat-title{flex:1;text-align:center;font-size:20px;font-weight:700;letter-spacing:-.03em}.cat-top .spacer{width:80px}
.poems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.poem{position:relative;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:15px;padding:20px 20px 62px;border:1px solid var(--line);background:var(--card);border-radius:20px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}.poem:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 32%,var(--line))}.copy{position:absolute;right:14px;bottom:14px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:8px 12px;font-size:12px;font-weight:650;cursor:pointer;transition:transform .16s}.copy:active{transform:scale(.95)}.status{color:var(--muted);font-size:13px;text-align:center;padding:12px}.empty{text-align:center;color:var(--muted);padding:40px 10px;grid-column:1/-1}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.category{min-height:128px;padding:16px 8px;border-radius:19px}.emoji{font-size:30px}.cat-name{font-size:13px}.poems{grid-template-columns:1fr}.poem{font-size:15px;padding:18px 17px 60px}.top{padding:13px 0}.hero{padding:10px 0 19px}}@media(max-width:420px){.wrap{padding-left:13px;padding-right:13px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{gap:9px}.lang button{padding:8px 10px}.category{min-height:120px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="back" href="https://zarnalhome.odoo.com/">← Back</a><button class="theme" id="themeBtn" aria-label="Toggle dark mode">🌙</button></header>
<section class="hero"><div class="hero-icon">💗</div><h1>Zarnal Shayri</h1><p>Words for every mood, feeling and moment.</p></section>
<div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search categories or shayri…" autocomplete="off"></label><div class="lang" aria-label="Language selector"><button id="hiBtn" class="active" type="button">हिंदी</button><button id="enBtn" type="button">English</button></div></div>
<div id="categoryView"><div class="category-grid" id="categories"></div></div>
<section class="view" id="poemView"><div class="cat-top"><button class="back" id="catBack">← Categories</button><div class="cat-title" id="catTitle"></div><div class="spacer"></div></div><div class="status" id="poemStatus"></div><div class="poems" id="poems"></div></section>
</div>
<script>
const categoryMeta=[['romantic','❤️','Romantic'],['heartbreak','💔','Heartbreak'],['friendship','👬','Friendship'],['funny','😄','Funny'],['attitude','😎','Attitude'],['birthday','🎂','Birthday'],['goodmorning','☀️','Good Morning'],['goodnight','🌙','Good Night'],['motivational','🌸','Motivational'],['life','🌈','Life'],['thoughtful','💭','Thoughtful'],['sad','😢','Sad'],['emotional','🥺','Emotional'],['missyou','😔','Miss You']];
let data={},language='hi',selected=null;
const categoriesEl=document.getElementById('categories'),categoryView=document.getElementById('categoryView'),poemView=document.getElementById('poemView'),searchEl=document.getElementById('search');
const savedTheme=localStorage.getItem('shayri-theme');if(savedTheme==='dark')document.body.classList.add('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️':'🌙';
document.getElementById('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');localStorage.setItem('shayri-theme',dark?'dark':'light');document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';});
function setLanguage(lang){language=lang;document.getElementById('hiBtn').classList.toggle('active',lang==='hi');document.getElementById('enBtn').classList.toggle('active',lang==='en');if(selected)renderPoems();}
document.getElementById('hiBtn').onclick=()=>setLanguage('hi');document.getElementById('enBtn').onclick=()=>setLanguage('en');
function drawCategories(){categoriesEl.replaceChildren();const q=searchEl.value.trim().toLocaleLowerCase();categoryMeta.forEach(([id,emoji,name],idx)=>{const items=data[id]||[];if(q&&!name.toLowerCase().includes(q)&&!items.some(x=>(x.hi+' '+x.en).toLowerCase().includes(q)))return;const b=document.createElement('button');b.className='category';b.style.animationDelay=Math.min(idx*22,200)+'ms';b.innerHTML='<span class="emoji">'+emoji+'</span><span class="cat-name">'+name+' Shayri</span><span class="count">'+(items.length?items.length+' poems':'Data not connected')+'</span>';b.onclick=()=>openCategory(id);categoriesEl.appendChild(b);});if(!categoriesEl.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No categories or poems found';categoriesEl.appendChild(empty);}}
function openCategory(id){selected=id;categoryView.style.display='none';poemView.classList.add('show');document.getElementById('catTitle').textContent=categoryMeta.find(c=>c[0]===id)?.[2]+' Shayri';searchEl.value='';renderPoems();window.scrollTo({top:0,behavior:'smooth'});}
function backCategories(){selected=null;poemView.classList.remove('show');categoryView.style.display='';drawCategories();window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('catBack').onclick=backCategories;
function renderPoems(){const list=document.getElementById('poems'),q=searchEl.value.trim().toLowerCase(),items=data[selected]||[],shown=items.filter(x=>(x.hi+' '+x.en).toLowerCase().includes(q));list.replaceChildren();document.getElementById('poemStatus').textContent=items.length?(q?shown.length+' of '+items.length+' poems':items.length+' poems'):'This category data is not connected yet';if(!shown.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=items.length?'No Shayri matches your search':'This category is listed, but its sheet data has not been connected yet.';list.appendChild(empty);return;}shown.forEach((item,i)=>{const card=document.createElement('article');card.className='poem';card.textContent=(language==='hi'?item.hi:item.en)|| (language==='hi'?item.en:item.hi);const btn=document.createElement('button');btn.className='copy';btn.type='button';btn.textContent='Copy';btn.onclick=async()=>{try{await navigator.clipboard.writeText(card.textContent.replace(/\s*$/,''));btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1300);}catch(e){btn.textContent='Copy unavailable';}};card.appendChild(btn);list.appendChild(card);});}
searchEl.addEventListener('input',()=>selected?renderPoems():drawCategories());
async function init(){document.getElementById('poemStatus').textContent='Loading collection…';try{const response=await fetch('./shayri-data.json',{cache:'no-cache'});if(response.ok){data=await response.json();drawCategories();return;}}catch(e){}try{const csvUrl='https://docs.google.com/spreadsheets/d/e/2PACX-1vSyBd6upPQ9zliho-JX8TQqauwSKSaSVk5fiHldKFyErpl_yqk4U0E6Ay97U9CpbesrCeLeHrIzFqje/pub?output=csv';const res=await fetch(csvUrl,{cache:'no-cache'});if(!res.ok)throw new Error('CSV unavailable');const csv=await res.text();const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<csv.length;i++){const c=csv[i];if(quoted){if(c==='"'&&csv[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\\n'){row.push(cell);rows.push(row);row=[];cell='';}else if(c!=='\\r')cell+=c;}if(cell||row.length){row.push(cell);rows.push(row);}data.romantic=rows.filter(r=>r.length>=2&&(r[0]||r[1])).map(r=>({hi:r[0]||'',en:r[1]||''}));drawCategories();}catch(e){categoriesEl.innerHTML='<div class="empty" style="grid-column:1/-1">Could not load Shayri data. Please refresh or connect the published spreadsheet.</div>';console.error(e);}}
init();
</script>
</body>
</html>
