<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#fff7fa">
<title>Shayri</title>
<style>
/* Self-contained: no fonts, images, APIs, CDN, or network requests. */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff8fb;color:#251c24;transition:background .25s,color .25s}
body.dark{background:#211923;color:#f5edf3}
:root{--accent:#d85f8b;--soft:#fce9f0;--surface:#fff;--text:#251c24;--muted:#897985;--border:rgba(120,70,100,.14);--shadow:0 7px 22px rgba(72,32,53,.06)}
body.dark{--accent:#e99ab8;--soft:rgba(233,154,184,.15);--surface:#302532;--text:#f5edf3;--muted:#b8a9b6;--border:rgba(255,255,255,.1);--shadow:0 8px 25px rgba(0,0,0,.17)}
.page{width:100%;max-width:1120px;margin:0 auto;padding:0 18px 42px}
.top{display:flex;align-items:center;justify-content:space-between;padding:17px 0}
button{font-family:inherit;color:inherit;cursor:pointer}
.back{border:0;background:transparent;border-radius:12px;padding:9px 12px;font-weight:600;text-decoration:none;color:var(--text)}
.back:hover{background:var(--soft)}
.theme{width:43px;height:43px;border:1px solid var(--border);background:var(--surface);border-radius:50%;font-size:18px}
.hero{text-align:center;padding:12px 0 23px}
.hero-emoji{font-size:40px}
h1{font-size:clamp(24px,4vw,34px);letter-spacing:-.04em;margin:8px 0 6px}
.subtitle{margin:0;color:var(--muted);font-size:14px}
.toolbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.lang{display:flex;background:var(--soft);padding:4px;border-radius:13px}
.lang button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:650;padding:9px 12px;border-radius:10px}
.lang button.active{background:var(--surface);color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.06)}
/* Flex fallback for browsers without CSS Grid */
.categories,.poems{display:flex;flex-wrap:wrap;margin:-7px}
.category{width:calc(25% - 14px);margin:7px;min-height:143px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:22px;padding:18px 10px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.category:hover{transform:translateY(-3px);box-shadow:0 13px 28px rgba(170,72,113,.1);border-color:var(--accent)}
.category:active{transform:scale(.97)}
.cat-emoji{font-size:33px;line-height:1}
.cat-name{font-size:14px;font-weight:650;text-align:center}
.cat-count{font-size:12px;color:var(--muted)}
.poem-card{position:relative;width:calc(50% - 14px);margin:7px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:15px;padding:20px 18px 62px;border:1px solid var(--border);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.poem-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.copy{position:absolute;right:13px;bottom:13px;border:1px solid var(--border);background:var(--soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:650}
.copy:active{transform:scale(.96)}
.poem-view{display:none}
.poem-view.open{display:block}
.category-view.hide{display:none}
.category-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.category-head .title{font-size:20px;font-weight:700;text-align:center;flex:1}
.category-head .back{padding-left:0}
.category-head .side{width:90px}
.status{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.empty{width:100%;text-align:center;color:var(--muted);padding:34px 10px}
@supports(display:grid){.categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0}.category{width:auto;margin:0}.poems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:0}.poem-card{width:auto;margin:0}}
@media(max-width:760px){.page{padding:0 16px 35px}.category{min-height:127px;padding:15px 8px}.cat-emoji{font-size:30px}.cat-name{font-size:13px}.poem-card{width:calc(100% - 14px);margin:7px}.categories,.poems{margin:-7px}.category-head .side{width:74px}}
@supports(display:grid){@media(max-width:760px){.categories{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.poems{grid-template-columns:1fr;gap:12px}}}
@media(max-width:420px){.page{padding-left:13px;padding-right:13px}.category{min-height:120px}.category-head .side{width:58px}.category-head .title{font-size:18px}.lang button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header class="top"><a class="back" href="https://zarnalhome.odoo.com/">← Back</a><button class="theme" id="theme" title="Toggle theme">🌙</button></header>

<div class="toolbar"><div class="lang"><button id="hindi" class="active">हिंदी</button><button id="roman">English</button></div></div>
<div class="category-view" id="categoryView"><div class="categories" id="categories"></div></div>
<section class="poem-view" id="poemView"><div class="category-head"><button class="back" id="back">← Categories</button><div class="title" id="catTitle"></div><div class="side"></div></div><div class="status" id="status"></div><div class="poems" id="poems"></div></section>
</div>
<script>
var SHAYRI_DATA={"romantic":[{"hi":"इतना खूबसूरत चेहरा है तुम्हारा 😍💕\nहर दिल दीवाना है तेरा ❤️🔥\nलोग कहते हैं चांद का टुकड़ा हो तुम 🌙✨\nलेकिन हम कहते हैं चांद टुकड़ा है तुम्हारा 😘🌟","en":"Itna Khubsurat Chehra Hai Tumhara 😍💕\nHar Dil Deewana Hai Tera ❤️🔥\nLog Kahte Hai Chand Ke Tukda Ho Tum 🌙✨\nLekin Hum Kahte Hai Chand Tukda Hai Tumhara 😘🌟"},{"hi":"लगता है तुम्हें नज़र में बसा लूँ 👀💖\nऔरों की नजरों से तुम्हें बचा लूँ 🛡️❤️\nकहीं चुरा ना ले तुम्हें मुझसे कोई 😔💔\nआ तुझे मैं अपनी धड़कन में छुपा लूँ ❤️","en":"Lagta hai tumhe nazar mein basa loon 👀💖\nAuron ki nazron se tumhe bacha loon 🛡️❤️\nKahin chura na le tumhe mujhse koi 😔💔\nAa tujhe main apni dhadkan mein chhupa loon ❤️"},{"hi":"जी चाहे की दुनिया की हर एक फ़िक्र भुला कर 😌🌍\nदिल की बातें सुनाऊं तुझे मैं पास बिठाकर ❤️🗣️💑","en":"Jee chahe ki duniya ki har ek fikr bhula kar 😌🌍\nDil ki baatein sunaun tujhe main paas bithakar ❤️🗣️💑"},{"hi":"प्यार, मोहब्बत, आशिकी...\nये बस अल्फ़ाज़ थे... 💭\nमगर जब तुम मिले... 😍\nतब इन अल्फ़ाज़ों को मायने मिले!! 💖","en":"Pyaar, mohabbat, aashiqui...\nYeh bas alfaaz the... 💭\nMagar jab tum mile... 😍\nTab in alfaazon ko maayne mile!! 💖"},{"hi":"उसकी 👀 आँखें, उसकी 💁‍♀️ ज़ुल्फ़ें, उसके 👄 होंठ, उसके 😊 गाल,\nये सब बाद का मसला है,\nमुझे तो उसके 📝 नाम से भी ❤️ इश्क़ है।","en":"Uski 👀 aankhein, uski 💁‍♀️ zulfein, uske 👄 honth, uske 😊 gaal,\nYe sab baad ka masla hai,\nMujhe to uske 📝 naam se bhi ❤️ ishq hai."},{"hi":"तुम मुझे तब भी अच्छे लगते हो,\nजब मुझे कुछ भी अच्छा नहीं लगता। ❤️","en":"Tum mujhe tab bhi ❤️ ache lagte ho,\njab mujhe kuch bhi  acha nahi lagta."},{"hi":"हम तो फ़ना हो गए उसकी 👀 आँखें देखकर ग़ालिब,\nना जाने वो 🪞 आइना कैसे देखते होंगे। ❤️","en":"Hum to fana ho gaye uski 👀 aankhein dekhkar Ghalib,\nNa jaane wo 🪞 aaina kaise dekhte honge. 💔"},{"hi":"अजी\" 👀 आँखों से सवाल पूछना किसने सिखाया तुमको,\n😊 मुस्कुराकर मार देना किसने सिखाया तुमको,\n💭 मन करता है तुम्हें सामने बैठा कर रखूं,\n❤️ उसने इतना प्यारा क्यों बनाया तुमको...","en":"\"Aji\" 👀 aankhon se sawal puchna kisne sikhaya tumko,\n😊 Muskurakar mar dena kisne sikhaya tumko,\n💭 Mann karta hai tumhe saamne bitha kar rakhu,\n❤️ Usne itna pyaara kyun banaya tumko..."},{"hi":"ज़मीन से दूर जाने को दिल करता है,\nआसमान में घर बनाने को दिल करता है... ☁️🏠\nजिस दिन तुझे कोई और छू लेता है ना,\nमेरा मर जाने को दिल करता है... 😊♥️","en":"Zameen se door jaane ko dil karta hai,\nAasman mein ghar banane ko dil karta hai... ☁️🏠\nJis din tujhe koi aur chhoo leta hai na,\nMera mar jaane ko dil karta hai... 😊♥️"},{"hi":"चाँदी 🪙 सोना 🪩 एक तरफ़,\nतेरा होना ❤️ एक तरफ़,\nएक तरफ़ तेरी 👀 आँखें,\nजादू-टोना ✨ एक तरफ़।","en":"Chaandi 🪙 sona 🪩 ek taraf,\nTera hona ❤️ ek taraf,\nEk taraf teri 👀 aankhen,\nJaadu tona ✨ ek taraf."},{"hi":"रोशनी से तेरी वहाँ 🌕 चाँद रूठा बैठा है,\nमैंने माँगा तुझे जब भी टूटा हुआ 🌠 तारा देखा है।\nतेरी जैसी महक यहाँ किसी 🌸 फूल में नहीं,\nयक़ीन कर मेरा — मैंने हर बार तुझे ही देखा है... ❤️","en":"Roshni se teri waha 🌕 chaand rootha baitha hai,\nMaine manga tujhe jab bhi 🌠 toota hua taara dekha hai.\nTeri jaisi mehek yaha kisi 🌸 phool mein nahi,\nYakeen kar mera — maine har baar tujhe hi dekha hai... ❤️"},{"hi":"इतना खूबसूरत 😍 चेहरा है तुम्हारा,\nहर दिल ❤️ दीवाना है तुम्हारा।\nलोग कहते हैं 🌙 चाँद का टुकड़ा हो तुम,\nलेकिन हम कहते हैं — चाँद 🔮 टुकड़ा है तुम्हारा।","en":"Itna khoobsurat 😍 chehra hai tumhara,\nHar dil ❤️ deewana hai tumhara.\nLog kehte hain tum 🌙 chaand ka tukda ho,\nLekin hum kehte hain — chaand 🔮 tukda hai tumhara."},{"hi":"सजदे में सर को 🙇‍♂️ झुकाया करेंगे,\nतेरे बारे में सबको 📣 बताया करेंगे।\nतेरी बातें 🤲 समझ में आए या ना आए,\nहम ‘हाँ’ में ‘हाँ’ तो 👍 मिलाया करेंगे।","en":"Sajde mein sar ko 🙇‍♂️ jhukaya karenge,\nTere baare mein sabko 📣 bataya karenge.\nTeri baatein 🤲 samajh aaye ya na aaye,\nHum haan mein haan to 👍 milaya karenge."},{"hi":"मसला हल हुआ? 🤔 हुआ कि नहीं?\nहमसा कोई मिला? 🤷‍♂️ मिला कि नहीं?\nछोड़ दीजिए हमको… हम तो बेदिल हैं 💔,\nआपका दिल लगा? ❤️ लगा कि नहीं?","en":"Masla hal hua? 🤔 Hua ki nahi?\nHamsa koi mila? 🤷‍♂️ Mila ki nahi?\nChhodiye humko… hum toh be-dil hain 💔,\nAapka dil laga? ❤️ Laga ki nahi?"},{"hi":"तेरे जैसा 🌟 नूर है कहाँ,\nसितारे 🤯 पागल, चाँद 🌕 भी ख़फ़ा।\nतेरी ज़ुल्फ़ों की क़ैद ऐसी है,\nकि रिहाई भी 🕊️ मुझको सज़ा ही लगती है।\n🌕 चाँद होना मज़ाक नहीं,\nकरोड़ों ⭐ तारे हर वक़्त नज़र 👀 रखते हैं।","en":"Tere jaisa 🌟 noor hai kahaan,\nSitaare 🤯 paagal, chaand 🌕 bhi khafa.\nZulfon ki qaid teri aisi hai,\nKe rihaai 🕊️ bhi mujhko saza lagti hai.\n🌕 Chaand hona mazaak nahi,\nKarodon ⭐ taare har waqt nazar 👀 rakhte hain."},{"hi":"कोई इतना प्यारा 😍 कैसे हो सकता है,\nफिर सारे का सारा ❤️ कैसे हो सकता है।\nतुझसे जब मिलकर भी 😔 उदासी कम नहीं होती,\nतेरे बग़ैर गुज़ारा 😢 कैसे हो सकता है।","en":"Koi itna pyaara 😍 kaise ho sakta hai,\nPhir saara ka saara ❤️ kaise ho sakta hai.\nTujhse milkar bhi 😔 udaasi kam nahi hoti,\nTere bagair guzara 😢 kaise ho sakta hai."},{"hi":"\"जान\" कहने से कोई जान ❤️ नहीं होता है,\nकोई कह भी दे तो नुकसान ❌ नहीं होता है।\nये तो मैं हूँ जिसने छोड़ दिया 💔 छोड़ दिया,\nवरना ये फ़ैसला 🔥 आसान नहीं होता है।","en":"\"Jaan\" kehne se koi ❤️ jaan nahi hota hai,\nKoi keh bhi de to ❌ nuksaan nahi hota hai.\nYe to main hoon jisne 💔 chhod diya,\nWarna ye faisla 🔥 aasan nahi hota hai."},{"hi":"बिना मेरे जुबां  पे आए,\nतेरे दिल ❤️ तक पहुँच जाए —\nये इस दिल की 🫀 अर्ज़ी है...\nबाकी मेरी जान 😘 — तेरी मर्ज़ी है।","en":"Bina mere zubaan  pe aaye,\nTere dil ❤️ tak pahunch jaaye —\nYe is dil ki 🫀 arzī hai...\nBaaki meri jaan 😘 — teri marzī hai."},{"hi":"तुम मेरी सोच 🤔 हो, तुम्हें कोई और सोचे क्यों...\nतुम मेरी चाहत ❤️ हो, तुम्हें कोई और चाहे क्यों...\nतुम मेरा आईना 🪞 हो, तुम्हें कोई और देखे क्यों...\nतुम मेरी दुआ 🤲 हो, तुम्हें कोई और मांगे क्यों।","en":"Tum meri soch 🤔 ho, tumhe koi aur soche kyun...\nTum meri chahat ❤️ ho, tumhe koi aur chahe kyun...\nTum mera aaina 🪞 ho, tumhe koi aur dekhe kyun...\nTum meri dua 🤲 ho, tumhe koi aur maange kyun."},{"hi":"तू अगर सलीके से 💔 तोड़ता मुझे,\nतो मेरे टुकड़े 🧩 भी तेरे काम आते।","en":"Tu agar saliike se 💔 todta mujhe,\nToh mere tukde 🧩 bhi tere kaam aate."},{"hi":"मुझे चाँद 🌝 देखना पसंद है,\nउसे चाँद सा दिखना पसंद है। 💫\n\nवो भी अपने दाग नहीं छुपाती,\nआँखों में काजल 🙅‍♀️, माथे पे बिंदी  नहीं लगाती। 🧏💞\n\nहोंठों को उन्हीं के हाल पर छोड़ देती है 🫶,\nमुस्कुराते ही 😊 समाज के सारे बंधन तोड़ देती है। 🔓💥","en":"Mujhe chaand 🌝 dekhna pasand hai,\nUse chaand sa dikhna pasand hai. 💫\n\nWo bhi apne daag nahi chhupati,\nAankhon mein kajal 🙅‍♀️, mathe pe bindi  nahi lagati. 🧏💞\n\nHonthon ko unhi ke haal par chhod deti hai 🫶,\nMuskuraate hi 😊 samaaj ke saare bandhan tod deti hai. 🔓💥"},{"hi":"तेरी सूरत साफ़ शीशे की तरह 🔮\nमेरे दामन में दाग़ हज़ारों हैं 🌑\nतूँ नायाब किसी पत्थर की तरह 💎\nमेरा उठना-बैठना बाज़ारों में है 🏙️\n\nमैंने खोया है अपनी हर प्यारी चीज़ को 💔\nमैं अपनी किस्मत फिर भी आज़माऊंगा 🎲\nइस ज़मीन पर कोई ख़ास है नहीं मेरा 🏜️\nतूँ कुबूल करे, मैं अपने गवाहों को आसमान से बुलाऊंगा 🌌🌠","en":"Teri seerat saaf sheeshe ki tarah 🔮\nMere daaman mein daag hazaaron hain 🌑\nTu naayaab kisi patthar ki tarah 💎\nMera uthna-baithna baazaron mein hai 🏙️\n\nMaine khoya hai apni har pyaari cheez ko 💔\nMain apni kismat phir bhi aazmaunga 🎲\nIs zameen par koi khaas hai nahi mera 🏜️\nTu qubool kare, main apne gawaahon ko aasmaan se bulaunga 🌌🌠"},{"hi":"💋 अपने हसीन होंठों को किसी परदे में छुपा लिया करो,\nहम गुस्ताख लोग हैं 👀 नज़रों से चूम लिया करते हैं 😘........!!!","en":"💋 Apne hasin hotho ko kisi parde mein chhupa liya karo,\nHum gustaakh log hain 👀 nazaron se choom liya karte hain 😘........!!!"},{"hi":"🌙 चाँद रोज़ छत पर आकर इतराता बहुत था,\nकल रात मैंने भी उसे तेरी तस्वीर दिखा दी 😍📸........!!!","en":"🌙 Chaand roz chhat par aakar itraata bahut tha,\nKal raat maine bhi usse teri tasveer dikha di 😍📸........!!!"},{"hi":"💖 तू मिल गई है तो मुझ पे नाराज़ है खुदा,\nकहता है कि तू अब कुछ माँगता नहीं है 🙏❤️.....!!!","en":"💖 Tu mil gayi hai to mujh pe naraaz hai Khuda,\nKahta hai ki tu ab kuch maangta nahin hai 🙏❤️.....!!!"},{"hi":"💘 कोई अजनबी ख़ास हो रहा है,\nलगता है फिर प्यार हो रहा है... 💞😊","en":"💘 Koi ajnabi khaas ho raha hai,\nLagta hai phir pyaar ho raha hai... 💞😊"},{"hi":"🌍 सारी दुनिया की ख़ुशी अपनी जगह,\nउन सबके बीच तेरी कमी अपनी जगह 💔……!!!","en":"🌍 Saari duniya ki khushi apni jagah,\nUn sabke beech teri kami apni jagah 💔……!!!"},{"hi":"🌙 हमें भी नींद आ जाएगी, हम भी सो ही जाएँगे,\nअभी कुछ बे-क़रारी है… सितारों ✨ तुम तो सो जाओ 😔💤","en":"🌙 Humein bhi neend aa jaayegi, hum bhi so hi jaayenge,\nAbhi kuch be-qarari hai... sitaaro ✨ tum to so jao 😔💤"},{"hi":"🔥 यारो कुछ तो ज़िक्र करो तुम उसकी क़यामत बाहों का,\nवो जो सिमटते होंगे उनमें — वो तो मर जाते होंगे 💘😮‍💨","en":"🔥 Yaaro kuch to zikr karo tum uski qayaamat baahon ka,\nWoh jo simatte honge unmein — woh to mar jaate honge 💘😮‍💨"},{"hi":"🌙 बेचैन इस क़दर था कि सोया न रात भर,\nपलकों से लिख रहा था तिरा नाम चाँद पर ✍️😔💫","en":"🌙 Bechain is qadar tha ki soya na raat bhar,\nPalkon se likh raha tha tera naam chaand par ✍️😔💫"},{"hi":"🫀 कुछ सोचता हूँ तो तेरा ख़्याल आ जाता है,\nकुछ बोलता हूँ तो तेरा नाम आ जाता है 🗣️💭\nकब तक छुपा के रखूँ दिल की बात को,\nतेरी हर अदा पर मुझे प्यार आ जाता है ❤️🥺","en":"🫀 Kuch sochta hoon to tera khyaal aa jaata hai,\nKuch bolta hoon to tera naam aa jaata hai 🗣️💭\nKab tak chhupa ke rakhoon dil ki baat ko,\nTeri har ada par mujhe pyaar aa jaata hai ❤️🥺"},{"hi":"🚶‍♂️ सफर वहीं तक है जहाँ तक तुम हो,\n👀 नज़र वहीं तक है जहाँ तक तुम हो,\n🌸 हज़ारों फूल देखे हैं इस गुलशन में मगर,\n🌹 खुशबू वहीं तक है जहाँ तक तुम हो! ❤️","en":"🚶‍♂️ Safar wahiin tak hai jahan tak tum ho,\n👀 Nazar wahiin tak hai jahan tak tum ho,\n🌸 Hazaaron phool dekhe hain is gulshan mein magar,\n🌹 Khushboo wahiin tak hai jahan tak tum ho! ❤️"},{"hi":"😔 बिन तेरे मेरी हर खुशी अधूरी है,\n🤍 फिर सोच… मेरे लिए तू कितनी ज़रूरी है!","en":"😔 Bin tere meri har khushi adhoori hai,\n🤍 Phir soch… mere liye tu kitni zaroori hai!"},{"hi":"💖 कितना चाहते हैं तुमको,\nये कभी कह नहीं पाते…\nबस इतना जानते हैं,\nकि तेरे बिना रह नहीं पाते!\nLove You Jan 😘🌹","en":"💖 Kitna chahte hain tumko,\nYeh kabhi keh nahin paate…\nBas itna jaante hain,\nKi tere bina reh nahin paate!\nLove You Jan 😘🌹"},{"hi":"🤗 सीने से लगाकर तुमसे बस\nइतना ही कहना है…\nमुझे ज़िंदगी भर आपके var CATS=[{"id": "romantic", "emoji": "❤️", "name": "Romantic"}, {"id": "heartbreak", "emoji": "💔", "name": "Heartbreak"}, {"id": "friendship", "emoji": "👬", "name": "Friendship"}, {"id": "funny", "emoji": "😄", "name": "Funny"}, {"id": "attitude", "emoji": "😎", "name": "Attitude"}, {"id": "birthday", "emoji": "🎂", "name": "Birthday"}, {"id": "goodmorning", "emoji": "☀️", "name": "Good Morning"}, {"id": "goodnight", "emoji": "🌙", "name": "Good Night"}, {"id": "motivational", "emoji": "🌸", "name": "Motivational"}, {"id": "life", "emoji": "🌈", "name": "Life"}, {"id": "thoughtful", "emoji": "💭", "name": "Thoughtful"}, {"id": "sad", "emoji": "😢", "name": "Sad"}, {"id": "emotional", "emoji": "🥺", "name": "Emotional"}, {"id": "missyou", "emoji": "😔", "name": "Miss You"}];
var currentLang="hi",currentCat=null;
var categoriesEl=document.getElementById("categories");
var categoryView=document.getElementById("categoryView"),poemView=document.getElementById("poemView");
function safeStoreGet(key){try{return localStorage.getItem(key);}catch(e){return null;}}
function safeStoreSet(key,value){try{localStorage.setItem(key,value);}catch(e){}}
if(safeStoreGet("zarnal-shayri-theme")==="dark"){document.body.className="dark";}
document.getElementById("theme").innerHTML=document.body.className==="dark"?"☀️":"🌙";
document.getElementById("theme").onclick=function(){var dark=document.body.className!=="dark";document.body.className=dark?"dark":"";safeStoreSet("zarnal-shayri-theme",dark?"dark":"light");document.getElementById("theme").innerHTML=dark?"☀️":"🌙";};
function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderCategories(){categoriesEl.innerHTML="";
for(var i=0;i<CATS.length;i++){var cat=CATS[i],items=SHAYRI_DATA[cat.id]||[];
var b=document.createElement("button");b.className="category";b.setAttribute("type","button");
b.innerHTML='<span class="cat-emoji">'+cat.emoji+'</span><span class="cat-name">'+escapeHTML(cat.name)+' Shayri</span><span class="cat-count">'+items.length+' poems</span>';
(function(id){b.onclick=function(){openCategory(id);};})(cat.id);categoriesEl.appendChild(b);}

}
function openCategory(id){currentCat=id;categoryView.className="category-view hide";poemView.className="poem-view open";var category=null;
for(var k=0;k<CATS.length;k++)if(CATS[k].id===id)category=CATS[k];
document.getElementById("catTitle").innerHTML=category?category.emoji+" "+escapeHTML(category.name)+" Shayri":"Shayri";
renderPoems();window.scrollTo(0,0);}
function returnCategories(){currentCat=null;poemView.className="poem-view";categoryView.className="category-view";renderCategories();window.scrollTo(0,0);}
document.getElementById("back").onclick=returnCategories;
function copyText(text,button){var success=false;
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){copyDone(button);},function(){fallbackCopy(text,button);});return;}
fallbackCopy(text,button);}
function fallbackCopy(text,button){var area=document.createElement("textarea");area.value=text;area.style.position="fixed";area.style.left="-1000px";document.body.appendChild(area);area.select();try{document.execCommand("copy");copyDone(button);}catch(e){button.innerHTML="Select & copy";}document.body.removeChild(area);}
function copyDone(button){button.innerHTML="Copied ✓";window.setTimeout(function(){button.innerHTML="Copy";},1400);}
function renderPoems(){var list=document.getElementById("poems"),items=SHAYRI_DATA[currentCat]||[],visible=items;
document.getElementById("status").innerHTML=items.length+" poems";
list.innerHTML="";
if(!visible.length){list.innerHTML='<div class="empty">'+(items.length?"No Shayri found for this search.":"No poems in this category.")+'</div>';return;}
for(var j=0;j<visible.length;j++){var poem=visible[j],txt=currentLang==="hi"?(poem.hi||poem.en):(poem.en||poem.hi);
var card=document.createElement("article");card.className="poem-card";card.appendChild(document.createTextNode(txt||""));
var copy=document.createElement("button");copy.className="copy";copy.type="button";copy.innerHTML="Copy";
(function(text,b){b.onclick=function(){copyText(text,b);};})(txt,copy);card.appendChild(copy);list.appendChild(card);}
}
document.getElementById("hindi").onclick=function(){currentLang="hi";this.className="active";document.getElementById("roman").className="";if(currentCat)renderPoems();};
document.getElementById("roman").onclick=function(){currentLang="en";this.className="active";document.getElementById("hindi").className="";if(currentCat)renderPoems();};
