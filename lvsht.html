<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Love Shorts — a vertical collection of romantic videos.">
<title>Love Shorts ♡</title>
<style>
:root{color-scheme:dark;--bg:#050507;--fg:#fff;--glass:rgba(18,17,23,.72);--line:rgba(255,255,255,.16);--accent:#f29abc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,a{-webkit-tap-highlight-color:transparent}
.feed{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;background:#000;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;width:100%;height:100vh;height:100dvh;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;isolation:isolate}
.video-frame{position:absolute;inset:0;display:grid;place-items:center;background:#000}
.video-frame iframe{display:block;width:100%;height:100%;border:0;background:#000;opacity:1}
.topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;text-decoration:none;font-size:13px;font-weight:650;box-shadow:0 8px 28px rgba(0,0,0,.2);transition:transform .18s ease,background .18s ease}
.pill:active{transform:scale(.96)}
.brand{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 12px #000;white-space:nowrap;pointer-events:none}
.counter{position:fixed;z-index:15;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);color:#fff;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.hint{position:fixed;z-index:15;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);color:rgba(255,255,255,.9);font-size:11px;white-space:nowrap;pointer-events:none;animation:hint 2.6s ease 2}
@keyframes hint{0%,100%{opacity:.45;translate:0 4px}45%{opacity:1;translate:0 0}}
.reel-link{position:absolute;z-index:5;left:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);color:#fff;text-decoration:none;font-size:12px;text-shadow:0 2px 12px #000;opacity:.82}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:700px){.reel{background:#08080b}.video-frame iframe{width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:480px;max-height:854px}.topbar{left:24px;right:24px}.counter{right:24px}}
@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}.hint{animation:none}}
</style>
</head>
<body>
<main class="feed" id="feed" aria-label="Love Shorts vertical video feed"></main>
<header class="topbar">
<a class="pill" href="https://zarnal.github.io/ZARNAL/zrnl.html" aria-label="Back to Zarnal home">← <span>Back</span></a>
<div class="brand">Love Shorts <span aria-hidden="true">♡</span></div>
<button class="pill" id="themeBtn" type="button" aria-label="Toggle appearance">☾ <span>Night</span></button>
</header>
<div class="counter" id="counter" aria-live="polite">01 / 41</div>
<div class="hint" id="hint" aria-hidden="true">↑ Swipe up for the next video</div>
<script>
'use strict';
const videos = ["jYTzeGuToPM","8B9QFnpjw58","1yOj1G2noPE","_HDsVbalb0o","iK6x_ud-NNI","zpjn8uPbAhw","r-vGytfjGVE","GNuIfXfmb7A","wO2FX8nXGWo","067r2yjkRxM","rmCXKwq7YxQ","k1zjLQGsyG4","WLIJ4Hpb0ko","Em_oNYkDiYw","x4TFi_9tvWQ","qRmg2a90QgU","Lmtdr1QKMms","9_UNsvtRJSA","oEkJZozYkbY","Airm4b2V0rc","rdn1zzgXxFw","9_N9CYLB_FE","q-hvHek0kp4","hw3Yc00Av00","ujONA2l8fzA","AOuqfaL51aU","uG1ng_fgWJg","pPUxeueDDGU","otDKoAksil0","3xVnkyAz5fI","uBqGSgvjUD0","GpGaht3exVk","qg98Y6a23mQ","5ueh0cM0Oz0","YKj_Lur9rmY","gMSvsY6zqYo","qykpmPnavtk","bfT5PFRjLUw","6oG21hDEb2I","px1Zv8LKZ0k","Lve_XmvmWHw"];
const feed = document.getElementById('feed');
const counter = document.getElementById('counter');
const hint = document.getElementById('hint');
let activeIndex = -1;
let observer = null;
let activationQueued = false;

videos.forEach((id,index)=>{
  const slide=document.createElement('section');
  slide.className='reel';
  slide.dataset.index=String(index);
  const frame=document.createElement('div');
  frame.className='video-frame';
  const link=document.createElement('a');
  link.className='reel-link';
  link.href='https://www.youtube.com/watch?v='+encodeURIComponent(id);
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent='Open on YouTube ↗';
  link.setAttribute('aria-label','Open Short '+(index+1)+' on YouTube');
  slide.append(frame,link);
  feed.appendChild(slide);
});

function activate(index){
  if(!Number.isInteger(index)||index<0||index>=videos.length||index===activeIndex)return;
  const oldSlide=feed.children[activeIndex];
  if(oldSlide){
    const oldPlayer=oldSlide.querySelector('iframe');
    if(oldPlayer)oldPlayer.remove();
  }
  activeIndex=index;
  const frame=feed.children[index].querySelector('.video-frame');
  const player=document.createElement('iframe');
  player.title='Love Short '+(index+1);
  player.loading='eager';
  player.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
  player.allowFullscreen=true;
  player.referrerPolicy='strict-origin-when-cross-origin';
  // Muted autoplay is the only reliable automatic-start mode on most mobile browsers.
  // Sound can be enabled with YouTube's own player controls; the page cannot override OS/browser policy.
  player.src='https://www.youtube.com/embed/'+encodeURIComponent(videos[index])+
    '?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1';
  frame.replaceChildren(player);
  counter.textContent=String(index+1).padStart(2,'0')+' / '+String(videos.length).padStart(2,'0');
  if(index>0)hint.style.display='none';
}

function chooseVisible(entries){
  let best=null;
  for(const entry of entries){
    if(entry.isIntersecting&&(!best||entry.intersectionRatio>best.intersectionRatio))best=entry;
  }
  if(best&&best.intersectionRatio>=0.65){
    const index=Number(best.target.dataset.index);
    if(!activationQueued){
      activationQueued=true;
      requestAnimationFrame(()=>{activate(index);activationQueued=false;});
    }
  }
}

if('IntersectionObserver' in window){
  observer=new IntersectionObserver(chooseVisible,{root:feed,threshold:[0.4,0.65,0.8,1]});
  [...feed.children].forEach(slide=>observer.observe(slide));
}else{
  let scrollTimer=0;
  feed.addEventListener('scroll',()=>{
    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(()=>activate(Math.round(feed.scrollTop/Math.max(feed.clientHeight,1))),100);
  },{passive:true});
}
activate(0);

document.getElementById('themeBtn').addEventListener('click',()=>{
  const light=document.documentElement.dataset.theme!=='light';
  document.documentElement.dataset.theme=light?'light':'dark';
  document.documentElement.style.setProperty('--glass',light?'rgba(35,31,39,.68)':'rgba(18,17,23,.72)');
  document.getElementById('themeBtn').innerHTML=light?'☀ <span>Day</span>':'☾ <span>Night</span>';
  document.getElementById('themeBtn').setAttribute('aria-label',light?'Switch to dark appearance':'Switch to light appearance');
});

feed.addEventListener('scroll',()=>{
  if(feed.scrollTop<30)hint.style.display='flex';
},{passive:true});
</script>
</body>
</html>
