<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17151d">
<meta name="description" content="A collection of romantic YouTube Shorts.">
<title>Love Shorts ♡</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--fg:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(20,18,25,.52);--line:rgba(255,255,255,.16);--pink:#f28ab2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,a{-webkit-tap-highlight-color:transparent}
.feed{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;background:#000}
.reel{position:relative;width:100%;height:100vh;height:100dvh;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center;background:#000;isolation:isolate}
.video-frame{position:absolute;inset:0;display:grid;place-items:center;background:#000}
.video-frame iframe{width:100%;height:100%;border:0;display:block;background:#000}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.04em;pointer-events:none}
.spinner{width:27px;height:27px;border:2px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.topbar{position:fixed;z-index:10;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;text-decoration:none;font:600 13px inherit;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:transform .2s ease,background .2s ease}
.pill:active{transform:scale(.95)}
.brand{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:650;letter-spacing:.02em;text-shadow:0 2px 12px #000;white-space:nowrap;pointer-events:none}
.counter{position:fixed;z-index:8;right:15px;bottom:calc(env(safe-area-inset-bottom) + 24px);padding:9px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);font-size:12px;font-variant-numeric:tabular-nums;color:#fff;pointer-events:none}
.hint{position:fixed;z-index:8;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);color:rgba(255,255,255,.88);font-size:11px;white-space:nowrap;pointer-events:none;animation:hint 2.8s ease-in-out 2}
@keyframes hint{0%,100%{opacity:.35;transform:translate(-50%,5px)}45%{opacity:1;transform:translate(-50%,0)}}
.sound-prompt{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(20,18,25,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 10px 36px rgba(0,0,0,.35);cursor:pointer}.sound-prompt:active{transform:translate(-50%,-50%) scale(.96)}
.reel-link{position:absolute;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 72px);left:16px;color:#fff;text-decoration:none;font-size:12px;text-shadow:0 2px 12px #000;opacity:.82}
.reel-link:focus-visible,.pill:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
@media(min-width:700px){.reel{background:#08080b}.video-frame iframe{width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:480px;max-height:854px}.topbar{left:24px;right:24px}.counter{right:24px}}
@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}.spinner,.hint{animation:none}}
</style>
</head>
<body>
<main class="feed" id="feed" aria-label="Love Shorts vertical video feed"></main>
<header class="topbar">
<a class="pill" href="https://zarnal.github.io/ZARNAL/zrnl.html" aria-label="Back to Zarnal home">← <span>Back</span></a>
<div class="brand">Love Shorts <span aria-hidden="true">♡</span></div>
<button class="pill" id="themeBtn" type="button" aria-label="Toggle appearance">☾ <span>Night</span></button>
</header>
<div class="counter" id="counter" aria-live="polite">01 / 41</div>
<div class="hint" id="hint" aria-hidden="true">↑ Swipe up for the next video</div>
<script>
const videos = ["jYTzeGuToPM","8B9QFnpjw58","1yOj1G2noPE","_HDsVbalb0o","iK6x_ud-NNI","zpjn8uPbAhw","r-vGytfjGVE","GNuIfXfmb7A","wO2FX8nXGWo","067r2yjkRxM","rmCXKwq7YxQ","k1zjLQGsyG4","WLIJ4Hpb0ko","Em_oNYkDiYw","x4TFi_9tvWQ","qRmg2a90QgU","Lmtdr1QKMms","9_UNsvtRJSA","oEkJZozYkbY","Airm4b2V0rc","rdn1zzgXxFw","9_N9CYLB_FE","q-hvHek0kp4","hw3Yc00Av00","ujONA2l8fzA","AOuqfaL51aU","uG1ng_fgWJg","pPUxeueDDGU","otDKoAksil0","3xVnkyAz5fI","uBqGSgvjUD0","GpGaht3exVk","qg98Y6a23mQ","5ueh0cM0Oz0","YKj_Lur9rmY","gMSvsY6zqYo","qykpmPnavtk","bfT5PFRjLUw","6oG21hDEb2I","px1Zv8LKZ0k","Lve_XmvmWHw"];
const feed = document.getElementById('feed');
const counter = document.getElementById('counter');
const hint = document.getElementById('hint');
let soundEnabled = false;
let activeIndex = -1;
let theme = 'dark';

videos.forEach((id, index) => {
  const slide = document.createElement('section');
  slide.className = 'reel';
  slide.dataset.index = String(index);
  slide.innerHTML = '<div class="video-frame"><div class="loading"><div><div class="spinner"></div>Loading short…</div></div></div><a class="reel-link" href="https://www.youtube.com/watch?v=' + encodeURIComponent(id) + '" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>';
  feed.appendChild(slide);
});

function activate(index) {
  if (index < 0 || index >= videos.length || index === activeIndex) return;
  const previous = feed.children[activeIndex];
  if (previous) {
    const oldFrame = previous.querySelector('iframe');
    if (oldFrame) oldFrame.remove();
    const oldLoading = previous.querySelector('.loading');
    if (oldLoading) oldLoading.hidden = false;
  }
  activeIndex = index;
  const slide = feed.children[index];
  const frame = slide.querySelector('.video-frame');
  const loading = frame.querySelector('.loading');
  if (loading) loading.hidden = false;
  const iframe = document.createElement('iframe');
  iframe.title = 'Love Short ' + (index + 1);
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videos[index]) + '?autoplay=1&mute=0&playsinline=1&controls=1&rel=0&modestbranding=1';
  iframe.addEventListener('load', () => { if (loading) loading.hidden = true; }, {once:true});
  frame.appendChild(iframe);
  counter.textContent = String(index + 1).padStart(2,'0') + ' / ' + String(videos.length).padStart(2,'0');
  if (index > 0) hint.style.display = 'none';
}

const observer = new IntersectionObserver(entries => {
  let best = null;
  for (const entry of entries) {
    if (entry.isIntersecting && (!best || entry.intersectionRatio > best.intersectionRatio)) best = entry;
  }
  if (best && best.intersectionRatio >= .65) activate(Number(best.target.dataset.index));
}, {root:feed,threshold:[.25,.5,.65,.8,1]});
[...feed.children].forEach(slide => observer.observe(slide));

document.getElementById('themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').innerHTML = theme === 'dark' ? '☾ <span>Night</span>' : '☀ <span>Day</span>';
  document.documentElement.style.setProperty('--glass', theme === 'dark' ? 'rgba(20,18,25,.52)' : 'rgba(255,255,255,.24)');
});
// If the browser blocks autoplay with audio, a deliberate tap retries playback with sound.
const soundPrompt = document.createElement('button');
soundPrompt.type = 'button';
soundPrompt.className = 'sound-prompt';
soundPrompt.textContent = '▶  Tap to play with sound';
soundPrompt.setAttribute('aria-label', 'Tap to play the video with sound');
document.body.appendChild(soundPrompt);
soundPrompt.addEventListener('click', () => {
  soundEnabled = true;
  soundPrompt.remove();
  const slide = feed.children[activeIndex];
  if (!slide) return;
  const iframe = slide.querySelector('iframe');
  if (iframe) {
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videos[activeIndex]) + '?autoplay=1&mute=0&playsinline=1&controls=1&rel=0&modestbranding=1';
  }
});

feed.addEventListener('scroll', () => {
  if (feed.scrollTop < 30) hint.style.display = 'flex';
}, {passive:true});
</script>
</body>
</html>
