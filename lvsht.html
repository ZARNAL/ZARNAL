<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Love Shorts — a vertical collection of romantic videos.">
<title>Love Shorts ♡</title>
<style>
:root{color-scheme:dark;--bg:#050507;--fg:#fff;--glass:rgba(18,17,23,.72);--line:rgba(255,255,255,.16);--accent:#f29abc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,a{-webkit-tap-highlight-color:transparent}
.feed{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;background:#000;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;width:100%;height:100vh;height:100dvh;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;isolation:isolate}
.video-frame{position:absolute;inset:0;display:grid;place-items:center;background:#000}
.video-frame iframe{display:block;width:100%;height:100%;border:0;background:#000;opacity:1}
.topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;text-decoration:none;font-size:13px;font-weight:650;box-shadow:0 8px 28px rgba(0,0,0,.2);transition:transform .18s ease,background .18s ease}
.pill:active{transform:scale(.96)}
.brand{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.02em;text-shadow:0 2px 12px #000;white-space:nowrap;pointer-events:none}
.sound-toggle[hidden]{display:none!important}.sound-toggle{position:fixed;z-index:25;right:14px;top:50%;transform:translateY(-50%);min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:13px;font-weight:650;box-shadow:0 8px 28px rgba(0,0,0,.28);cursor:pointer;touch-action:manipulation}.sound-toggle:active{transform:translateY(-50%) scale(.96)}@media(min-width:700px){.sound-toggle{right:max(24px,calc((100vw - 480px)/2 - 72px))}}
.counter{position:fixed;z-index:15;right:14px;bottom:calc(env(safe-area-inset-bottom) + 18px);padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);color:#fff;font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none}
.hint{position:fixed;z-index:15;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(16px);color:rgba(255,255,255,.9);font-size:11px;white-space:nowrap;pointer-events:none;animation:hint 2.6s ease 2}
@keyframes hint{0%,100%{opacity:.45;translate:0 4px}45%{opacity:1;translate:0 0}}
.start-gate{position:fixed;z-index:40;inset:0;display:grid;place-items:center;padding:28px;background:rgba(0,0,0,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.start-gate[hidden]{display:none}.start-card{width:min(100%,340px);padding:30px 24px;text-align:center;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:rgba(28,25,33,.88);box-shadow:0 24px 80px rgba(0,0,0,.4)}.start-heart{font-size:34px;margin-bottom:12px}.start-title{font-size:22px;font-weight:750;letter-spacing:-.04em;margin:0 0 9px}.start-copy{font-size:13px;line-height:1.55;color:rgba(255,255,255,.72);margin:0 0 22px}.start-button{width:100%;min-height:52px;border:0;border-radius:16px;background:#f29abc;color:#21121a;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 8px 26px rgba(242,154,188,.2);touch-action:manipulation}.start-button:active{transform:scale(.98)}.reel-link{position:absolute;z-index:5;left:16px;bottom:calc(env(safe-area-inset-bottom) + 70px);color:#fff;text-decoration:none;font-size:12px;text-shadow:0 2px 12px #000;opacity:.82}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:700px){.reel{background:#08080b}.video-frame iframe{width:min(100vw,56.25vh);height:min(100vh,177.78vw);max-width:480px;max-height:854px}.topbar{left:24px;right:24px}.counter{right:24px}}
@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}.hint{animation:none}}
</style>
</head>
<body>
<main class="feed" id="feed" aria-label="Love Shorts vertical video feed"></main>
<header class="topbar">
<a class="pill" href="https://zarnal.github.io/ZARNAL/zrnl.html" aria-label="Back to Zarnal home">← <span>Back</span></a>
<div class="brand">Love Shorts <span aria-hidden="true">♡</span></div>
<button class="pill" id="themeBtn" type="button" aria-label="Toggle appearance">☾ <span>Night</span></button>
</header>
<button class="sound-toggle" id="soundToggle" type="button" aria-label="Turn sound on">🔇 <span>Unmute</span></button>
<div class="start-gate" id="startGate"><div class="start-card"><div class="start-heart" aria-hidden="true">♡</div><h1 class="start-title">Your Love Shorts</h1><p class="start-copy">Tap once to start watching. Swipe up to move through the videos — playback will start automatically when each Short becomes active.</p><button class="start-button" id="startButton" type="button">Start watching&nbsp; →</button></div></div>
<div class="counter" id="counter" aria-live="polite">01 / 41</div>
<div class="hint" id="hint" aria-hidden="true">↑ Swipe up for the next video</div>
<script>
'use strict';
const videos = ["jYTzeGuToPM","8B9QFnpjw58","1yOj1G2noPE","_HDsVbalb0o","iK6x_ud-NNI","zpjn8uPbAhw","r-vGytfjGVE","GNuIfXfmb7A","wO2FX8nXGWo","067r2yjkRxM","rmCXKwq7YxQ","k1zjLQGsyG4","WLIJ4Hpb0ko","Em_oNYkDiYw","x4TFi_9tvWQ","qRmg2a90QgU","Lmtdr1QKMms","9_UNsvtRJSA","oEkJZozYkbY","Airm4b2V0rc","rdn1zzgXxFw","9_N9CYLB_FE","q-hvHek0kp4","hw3Yc00Av00","ujONA2l8fzA","AOuqfaL51aU","uG1ng_fgWJg","pPUxeueDDGU","otDKoAksil0","3xVnkyAz5fI","uBqGSgvjUD0","GpGaht3exVk","qg98Y6a23mQ","5ueh0cM0Oz0","YKj_Lur9rmY","gMSvsY6zqYo","qykpmPnavtk","bfT5PFRjLUw","6oG21hDEb2I","px1Zv8LKZ0k","Lve_XmvmWHw"];
const feed = document.getElementById('feed');
const counter = document.getElementById('counter');
const hint = document.getElementById('hint');
const startGate = document.getElementById('startGate');
let feedStarted = false;
let activeIndex = -1;
let scrollTimer = 0;
let activePlayer = null;
let soundEnabled = false;
try { soundEnabled = localStorage.getItem('loveShortsSound') === 'on'; } catch(e) { soundEnabled = false; }
const soundToggle = document.getElementById('soundToggle');
function updateSoundButton(){
  soundToggle.hidden = soundEnabled;
  soundToggle.innerHTML = '🔇 <span>Unmute</span>';
  soundToggle.setAttribute('aria-label', 'Turn sound on');
}
updateSoundButton();

videos.forEach((id,index)=>{
  const slide=document.createElement('section');
  slide.className='reel';
  slide.dataset.index=String(index);
  const frame=document.createElement('div');
  frame.className='video-frame';
  const link=document.createElement('a');
  link.className='reel-link';
  link.href='https://www.youtube.com/watch?v='+encodeURIComponent(id);
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent='Open on YouTube ↗';
  link.setAttribute('aria-label','Open Short '+(index+1)+' on YouTube');
  slide.append(frame,link);
  feed.appendChild(slide);
});

function activate(index){
  if(!Number.isInteger(index)||index<0||index>=videos.length||index===activeIndex)return;

  // Remove the previous iframe completely so two Shorts never play together.
  if(activePlayer){
    activePlayer.src='about:blank';
    activePlayer.remove();
    activePlayer=null;
  }
  const oldSlide=feed.children[activeIndex];
  if(oldSlide)oldSlide.querySelector('.video-frame').replaceChildren();

  activeIndex=index;
  const frame=feed.children[index].querySelector('.video-frame');
  const player=document.createElement('iframe');
  player.title='Love Short '+(index+1);
  player.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
  player.setAttribute('allowfullscreen','');
  player.setAttribute('playsinline','');
  player.setAttribute('loading','eager');
  player.referrerPolicy='strict-origin-when-cross-origin';

  // Explicit muted autoplay is the most reliable mode permitted by mobile browsers.
  // A visitor can enable audio once using the floating sound control.
  const params=new URLSearchParams({
    autoplay:'1',
    mute:'1',
    playsinline:'1',
    controls:'1',
    rel:'0',
    modestbranding:'1',
    enablejsapi:'1',
    origin:location.origin
  });
  player.src='https://www.youtube.com/embed/'+encodeURIComponent(videos[index])+'?'+params.toString();
  frame.replaceChildren(player);
  activePlayer=player;

  // Nudge playback after the iframe is attached. This does not bypass browser autoplay policy.
  player.addEventListener('load',()=>{
    if(index!==activeIndex||!player.contentWindow)return;
    player.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}), 'https://www.youtube.com');
    if(soundEnabled){
      player.contentWindow.postMessage(JSON.stringify({event:'command',func:'unMute',args:[]}), 'https://www.youtube.com');
    }
  },{once:true});

  counter.textContent=String(index+1).padStart(2,'0')+' / '+String(videos.length).padStart(2,'0');
  if(index>0)hint.style.display='none';
}

function getNearestReel(){
  let nearest=0;
  let minDistance=Infinity;
  const currentTop=feed.scrollTop;
  for(let i=0;i<feed.children.length;i++){
    const distance=Math.abs(feed.children[i].offsetTop-currentTop);
    if(distance<minDistance){minDistance=distance;nearest=i;}
  }
  return nearest;
}
function settleToVisibleReel(){
  if(!feedStarted)return;
  const index=getNearestReel();
  if(index!==activeIndex)activate(index);
}
function scheduleReelActivation(delay=120){
  if(!feedStarted)return;
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(settleToVisibleReel,delay);
}
feed.addEventListener('scroll',()=>{
  if(feed.scrollTop<30)hint.style.display='flex';
  scheduleReelActivation(120);
},{passive:true});
feed.addEventListener('scrollend',settleToVisibleReel,{passive:true});
window.addEventListener('resize',()=>scheduleReelActivation(180));
document.getElementById('startButton').addEventListener('click',()=>{
  if(feedStarted)return;
  feedStarted=true;
  startGate.hidden=true;
  activate(0);
});

soundToggle.addEventListener('click',()=>{
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('loveShortsSound', soundEnabled ? 'on' : 'off'); } catch(e) {}
  updateSoundButton();
  // Apply the sound choice to the current Short. The button disappears immediately;
  // every later Short inherits the saved unmuted preference in activate().
  if(activePlayer && activePlayer.contentWindow){
    const command=soundEnabled?'unMute':'mute';
    activePlayer.contentWindow.postMessage(JSON.stringify({event:'command',func:command,args:[]}), 'https://www.youtube.com');
    if(soundEnabled)activePlayer.contentWindow.postMessage(JSON.stringify({event:'command',func:'playVideo',args:[]}), 'https://www.youtube.com');
  }
});

document.getElementById('themeBtn').addEventListener('click',()=>{
  const light=document.documentElement.dataset.theme!=='light';
  document.documentElement.dataset.theme=light?'light':'dark';
  document.documentElement.style.setProperty('--glass',light?'rgba(35,31,39,.68)':'rgba(18,17,23,.72)');
  document.getElementById('themeBtn').innerHTML=light?'☀ <span>Day</span>':'☾ <span>Night</span>';
  document.getElementById('themeBtn').setAttribute('aria-label',light?'Switch to dark appearance':'Switch to light appearance');
});

feed.addEventListener('scroll',()=>{
  if(feed.scrollTop<30)hint.style.display='flex';
},{passive:true});
</script>
</body>
</html>
